<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1584" viewBox="0 0 1400 1584" role="img">
<title>User API tokens come from the profile page or eligible password login and carry the Fleet user’s role and scope; SSO and MFA require the profile page.</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs>
<rect width="1400" height="1584" fill="#F9FAFC"/>
<text x="48" y="80" text-anchor="start" font-family="Inter" font-size="40" font-weight="500" fill="#515774">A user API token carries its account’s permissions</text>
<rect x="48" y="176" width="576" height="112" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="336.0" y="244.6" text-anchor="middle" font-family="Inter" font-size="36" font-weight="500" fill="#192147">Signed-in profile page</text>
<rect x="776" y="176" width="576" height="112" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="1064.0" y="243.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="500" fill="#192147">Eligible email/password login</text>
<path d="M336 288 L336 336" fill="none" stroke="#8B8FA2" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M336 400 L336 432" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M1064 288 L1064 336" fill="none" stroke="#8B8FA2" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M1064 400 L1064 432" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="48" y="432" width="576" height="112" rx="12" fill="#D3E8F3" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="336.0" y="500.6" text-anchor="middle" font-family="Inter" font-size="36" font-weight="500" fill="#192147">Get API token</text>
<rect x="776" y="432" width="576" height="112" rx="12" fill="#D3E8F3" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="1064.0" y="500.6" text-anchor="middle" font-family="Inter" font-size="36" font-weight="500" fill="#192147">Returned token</text>
<rect x="48" y="336" width="576" height="64" rx="12" fill="#F9FAFC" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="336.0" y="377.8" text-anchor="middle" font-family="Inter" font-size="28" font-weight="500" fill="#192147">SSO / MFA accounts use this route</text>
<rect x="776" y="336" width="576" height="64" rx="12" fill="#F9FAFC" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="1064.0" y="378.5" text-anchor="middle" font-family="Inter" font-size="30" font-weight="500" fill="#192147">SSO / MFA: route closed</text>
<path d="M336 544 L336 624 L700 624 L700 736" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M1064 544 L1064 624 L700 624" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="232" y="736" width="936" height="112" rx="12" fill="#192147" stroke="#192147" stroke-width="2.5"/>
<text x="700" y="806" text-anchor="middle" font-family="Roboto Mono" font-size="34" font-weight="600" fill="#F9FAFC">Authorization: Bearer &lt;token&gt;</text>
<path d="M700 848 L700 984" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="232" y="984" width="936" height="176" rx="12" fill="#192147" stroke="#192147" stroke-width="2.5"/>
<text x="700.0" y="1061.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="600" fill="#F9FAFC">Fleet user account</text>
<text x="700.0" y="1105.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="600" fill="#F9FAFC">Automation: dedicated API-only account</text>
<rect x="232" y="1248" width="936" height="112" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="700.0" y="1317.3" text-anchor="middle" font-family="Inter" font-size="38" font-weight="500" fill="#192147">Role + scope checks</text>
<path d="M700 1160 L700 1248" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="48" y="1440" width="1304" height="96" rx="12" fill="#FBEBDC" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="700.0" y="1499.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="500" fill="#192147">Scope: user-authenticated API calls only</text>
</svg>
