<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1456" viewBox="0 0 1400 1456" role="img">
<title>Platform capability depends on provider operations, Fleet delivery, enrollment and ownership conditions; readers must inspect the actual matrix cell.</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs>
<rect width="1400" height="1456" fill="#F9FAFC"/>
<text x="48" y="80" text-anchor="start" font-family="Inter" font-size="40" font-weight="500" fill="#515774">Read the conditions behind a platform cell</text>
<rect x="408" y="160" width="584" height="112" rx="12" fill="#192147" stroke="#192147" stroke-width="2.5"/>
<text x="700.0" y="229.3" text-anchor="middle" font-family="Inter" font-size="38" font-weight="600" fill="#F9FAFC">Capability question</text>
<path d="M700 272 L700 368" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="408" y="368" width="584" height="112" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="700.0" y="435.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="500" fill="#192147">Provider operation exists</text>
<path d="M700 480 L700 600" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="408" y="600" width="584" height="144" rx="12" fill="#D3E8F3" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="700.0" y="661.1" text-anchor="middle" font-family="Inter" font-size="36" font-weight="500" fill="#192147">Fleet implements</text>
<text x="700.0" y="708.1" text-anchor="middle" font-family="Inter" font-size="36" font-weight="500" fill="#192147">a delivery path</text>
<rect x="48" y="336" width="264" height="112" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="180.0" y="403.2" text-anchor="middle" font-family="Inter" font-size="32" font-weight="500" fill="#192147">fleetd agent</text>
<rect x="48" y="512" width="264" height="136" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="180.0" y="571.8" text-anchor="middle" font-family="Inter" font-size="28" font-weight="500" fill="#192147">Native</text>
<text x="180.0" y="607.8" text-anchor="middle" font-family="Inter" font-size="28" font-weight="500" fill="#192147">management / API</text>
<rect x="48" y="712" width="264" height="136" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="180.0" y="770.2" text-anchor="middle" font-family="Inter" font-size="32" font-weight="500" fill="#192147">ChromeOS</text>
<text x="180.0" y="812.2" text-anchor="middle" font-family="Inter" font-size="32" font-weight="500" fill="#192147">extension</text>
<path d="M312 392 L352 392 L352 672 L408 672" fill="none" stroke="#8B8FA2" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M312 580 L352 580" fill="none" stroke="#8B8FA2" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M312 780 L352 780 L352 672" fill="none" stroke="#8B8FA2" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<text x="48" y="936" text-anchor="start" font-family="Inter" font-size="28" font-weight="400" fill="#515774">Alternative</text>
<text x="48" y="972" text-anchor="start" font-family="Inter" font-size="28" font-weight="400" fill="#515774">mechanisms</text>
<text x="48" y="1008" text-anchor="start" font-family="Inter" font-size="28" font-weight="400" fill="#515774">Availability varies</text>
<text x="48" y="1044" text-anchor="start" font-family="Inter" font-size="28" font-weight="400" fill="#515774">by row</text>
<path d="M700 744 L700 864" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="408" y="864" width="584" height="128" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="700.0" y="917.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="500" fill="#192147">Platform and enrollment</text>
<text x="700.0" y="961.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="500" fill="#192147">support the operation</text>
<path d="M700 992 L700 1096" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="408" y="1096" width="584" height="128" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="700.0" y="1149.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="500" fill="#192147">Ownership and other</text>
<text x="700.0" y="1193.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="500" fill="#192147">row conditions satisfied</text>
<path d="M700 1224 L700 1304" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="320" y="1304" width="1032" height="104" rx="12" fill="#FBEBDC" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="836.0" y="1367.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="500" fill="#192147">Read the specific cell and condition register</text>
<text x="1040" y="632" text-anchor="start" font-family="Inter" font-size="28" font-weight="400" fill="#515774">These are checks</text>
<text x="1040" y="668" text-anchor="start" font-family="Inter" font-size="28" font-weight="400" fill="#515774">for interpretation.</text>
<text x="1040" y="704" text-anchor="start" font-family="Inter" font-size="28" font-weight="400" fill="#515774">The diagram does</text>
<text x="1040" y="740" text-anchor="start" font-family="Inter" font-size="28" font-weight="400" fill="#515774">not calculate Yes.</text>
</svg>
