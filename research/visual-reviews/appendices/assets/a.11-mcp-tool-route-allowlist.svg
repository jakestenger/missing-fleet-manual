<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1856" viewBox="0 0 1400 1856" role="img">
<title>Choose MCP tools, expand their Fleet routes, deduplicate and add startup /me, then restore full method/path entries and test role and scope. Results websocket and client advice are separate boundaries.</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs>
<rect width="1400" height="1856" fill="#F9FAFC"/>
<text x="48" y="80" text-anchor="start" font-family="Inter" font-size="40" font-weight="500" fill="#515774">Derive the endpoint allowlist from the chosen MCP tools</text>
<rect x="48" y="168" width="752" height="112" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="424.0" y="235.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="500" fill="#192147">Selected assistant tasks</text>
<path d="M424 280 L424 376" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="48" y="376" width="752" height="112" rx="12" fill="#192147" stroke="#192147" stroke-width="2.5"/>
<text x="424.0" y="443.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="600" fill="#F9FAFC">Chosen MCP tools</text>
<path d="M424 488 L424 584" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="48" y="584" width="752" height="112" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="424.0" y="651.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="500" fill="#192147">Each tool’s Fleet routes</text>
<path d="M424 696 L424 792" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="48" y="792" width="752" height="112" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="424.0" y="859.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="500" fill="#192147">Deduplicate + add startup GET /me</text>
<path d="M424 904 L424 1000" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="48" y="1000" width="752" height="112" rx="12" fill="#192147" stroke="#192147" stroke-width="2.5"/>
<text x="424.0" y="1067.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="600" fill="#F9FAFC">Full method/path allowlist</text>
<path d="M424 1112 L424 1208" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="48" y="1208" width="752" height="112" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="424.0" y="1275.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="500" fill="#192147">Test intended role and scope</text>
<rect x="896" y="536" width="456" height="304" rx="12" fill="#D3E8F3" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="1124" y="600" text-anchor="middle" font-family="Inter" font-size="32" font-weight="500" fill="#192147">Read plus live query</text>
<text x="928" y="664" text-anchor="start" font-family="Inter" font-size="28" font-weight="400" fill="#515774">Adds routes:</text>
<text x="928" y="700" text-anchor="start" font-family="Inter" font-size="28" font-weight="400" fill="#515774">POST /hosts/{id}/query</text>
<text x="928" y="736" text-anchor="start" font-family="Inter" font-size="28" font-weight="400" fill="#515774">POST /reports/run</text>
<path d="M896 744 L848 744 L848 816 L800 816" fill="none" stroke="#8B8FA2" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="896" y="952" width="456" height="336" rx="12" fill="#F9FAFC" stroke="#C5C7D1" stroke-width="2.5" stroke-dasharray="8 8"/>
<text x="1124" y="1016" text-anchor="middle" font-family="Inter" font-size="28" font-weight="500" fill="#192147">Advisory client instructions</text>
<text x="1124" y="1096" text-anchor="middle" font-family="Inter" font-size="28" font-weight="500" fill="#192147">Fetch schema</text>
<text x="1124" y="1132" text-anchor="middle" font-family="Inter" font-size="28" font-weight="500" fill="#192147">Confirm live query</text>
<text x="1124" y="1168" text-anchor="middle" font-family="Inter" font-size="28" font-weight="500" fill="#192147">Outside authorization gate</text>
<text x="48" y="1416" text-anchor="start" font-family="Inter" font-size="30" font-weight="400" fill="#515774">Restore /api/v1/fleet on each shorthand route.</text>
<text x="48" y="1455" text-anchor="start" font-family="Inter" font-size="30" font-weight="400" fill="#515774">Submit each entry with its HTTP method and full path.</text>
<rect x="48" y="1544" width="1304" height="248" rx="12" fill="#FBEBDC" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="700" y="1612" text-anchor="middle" font-family="Inter" font-size="34" font-weight="500" fill="#192147">Separate boundary · GET /results/websocket</text>
<text x="700" y="1680" text-anchor="middle" font-family="Inter" font-size="32" font-weight="500" fill="#192147">Outside this allowlist mechanism</text>
<text x="700" y="1722" text-anchor="middle" font-family="Inter" font-size="32" font-weight="500" fill="#192147">The list does not grant or restrict this results stream.</text>
</svg>
