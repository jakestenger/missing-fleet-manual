<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1632" viewBox="0 0 1400 1632" role="img">
<title>GitOps writes desired configuration and returns apply logs; operator reads and imperative device actions use separate supported interfaces.</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs>
<rect width="1400" height="1632" fill="#F9FAFC"/>
<text x="48" y="80" text-anchor="start" font-family="Inter" font-size="40" font-weight="500" fill="#515774">Separate configuration apply from reading current state</text>
<rect x="48" y="176" width="408" height="144" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="252.0" y="237.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="500" fill="#192147">Repository</text>
<text x="252.0" y="281.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="500" fill="#192147">Desired configuration</text>
<path d="M456 248 L560 248" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="560" y="176" width="352" height="144" rx="12" fill="#192147" stroke="#192147" stroke-width="2.5"/>
<text x="736.0" y="260.6" text-anchor="middle" font-family="Inter" font-size="36" font-weight="600" fill="#F9FAFC">fleetctl gitops</text>
<path d="M912 248 L1040 248" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="1040" y="176" width="312" height="144" rx="12" fill="#192147" stroke="#192147" stroke-width="2.5"/>
<text x="1196.0" y="262.0" text-anchor="middle" font-family="Inter" font-size="40" font-weight="600" fill="#F9FAFC">Fleet</text>
<path d="M1196 320 L1196 392 L912 392 L912 320" fill="none" stroke="#8B8FA2" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
<text x="1112" y="456" text-anchor="middle" font-family="Inter" font-size="30" font-weight="500" fill="#192147">API responses</text>
<path d="M736 320 L736 472" fill="none" stroke="#8B8FA2" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="560" y="472" width="352" height="96" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="736.0" y="530.5" text-anchor="middle" font-family="Inter" font-size="30" font-weight="500" fill="#192147">Apply log / status</text>
<rect x="48" y="392" width="408" height="176" rx="12" fill="#F9FAFC" stroke="#C5C7D1" stroke-width="2.5" stroke-dasharray="8 8"/>
<text x="252" y="444" text-anchor="middle" font-family="Inter" font-size="30" font-weight="500" fill="#192147">Live state export</text>
<text x="252" y="483" text-anchor="middle" font-family="Inter" font-size="30" font-weight="500" fill="#192147">No GitOps</text>
<text x="252" y="522" text-anchor="middle" font-family="Inter" font-size="30" font-weight="500" fill="#192147">read/export interface</text>
<path d="M48 616 L1352 616" fill="none" stroke="#C5C7D1" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="48" y="688" text-anchor="start" font-family="Inter" font-size="36" font-weight="400" fill="#515774">Operator inspection</text>
<rect x="48" y="776" width="408" height="128" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="252.0" y="852.6" text-anchor="middle" font-family="Inter" font-size="36" font-weight="500" fill="#192147">Read request</text>
<rect x="600" y="752" width="752" height="176" rx="12" fill="#D3E8F3" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="976.0" y="829.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="500" fill="#192147">REST API / UI /</text>
<text x="976.0" y="873.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="500" fill="#192147">dedicated fleetctl read command</text>
<path d="M456 840 L600 840" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M976 928 L976 1040 L456 1040" fill="none" stroke="#8B8FA2" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="48" y="976" width="408" height="128" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="252.0" y="1052.6" text-anchor="middle" font-family="Inter" font-size="36" font-weight="500" fill="#192147">Current state</text>
<text x="944" y="1112" text-anchor="middle" font-family="Inter" font-size="30" font-weight="500" fill="#192147">Per-action support varies</text>
<path d="M48 1192 L1352 1192" fill="none" stroke="#C5C7D1" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="48" y="1264" text-anchor="start" font-family="Inter" font-size="36" font-weight="400" fill="#515774">Imperative device actions</text>
<rect x="48" y="1336" width="408" height="136" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="252.0" y="1394.2" text-anchor="middle" font-family="Inter" font-size="32" font-weight="500" fill="#192147">Operator action</text>
<text x="252.0" y="1436.2" text-anchor="middle" font-family="Inter" font-size="32" font-weight="500" fill="#192147">Lock / run / erase</text>
<path d="M456 1404 L600 1404" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="600" y="1336" width="752" height="136" rx="12" fill="#FBEBDC" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="976.0" y="1393.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="500" fill="#192147">Supported action interface</text>
<text x="976.0" y="1437.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="500" fill="#192147">Outside GitOps</text>
<text x="48" y="1576" text-anchor="start" font-family="Inter" font-size="30" font-weight="400" fill="#515774">GitOps may perform internal reads while applying configuration</text>
</svg>
