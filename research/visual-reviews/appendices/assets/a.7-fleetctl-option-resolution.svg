<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1600" viewBox="0 0 1400 1600" role="img">
<title>Only a command’s declared options receive flags, matching environment values and defaults. Standard client DEBUG and package debug are different options.</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs>
<rect width="1400" height="1600" fill="#F9FAFC"/>
<text x="48" y="80" text-anchor="start" font-family="Inter" font-size="40" font-weight="500" fill="#515774">The command’s declared options determine which values apply</text>
<rect x="48" y="184" width="408" height="128" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="252.0" y="259.2" text-anchor="middle" font-family="Inter" font-size="32" font-weight="500" fill="#192147">Explicit flags</text>
<path d="M252 312 L252 392 L700 392" fill="none" stroke="#8B8FA2" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="496" y="184" width="408" height="128" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="700.0" y="238.2" text-anchor="middle" font-family="Inter" font-size="32" font-weight="500" fill="#192147">Matching environment</text>
<text x="700.0" y="280.2" text-anchor="middle" font-family="Inter" font-size="32" font-weight="500" fill="#192147">variables</text>
<path d="M700 312 L700 392 L700 392" fill="none" stroke="#8B8FA2" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="944" y="184" width="408" height="128" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="1148.0" y="259.2" text-anchor="middle" font-family="Inter" font-size="32" font-weight="500" fill="#192147">Documented defaults</text>
<path d="M1148 312 L1148 392 L700 392" fill="none" stroke="#8B8FA2" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M700 392 L700 472" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="376" y="472" width="648" height="128" rx="12" fill="#192147" stroke="#192147" stroke-width="2.5"/>
<text x="700.0" y="549.3" text-anchor="middle" font-family="Inter" font-size="38" font-weight="600" fill="#F9FAFC">Command’s declared options</text>
<path d="M700 600 L700 704" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="376" y="704" width="648" height="112" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="700.0" y="773.3" text-anchor="middle" font-family="Inter" font-size="38" font-weight="500" fill="#192147">Invocation</text>
<path d="M48 912 L1352 912" fill="none" stroke="#C5C7D1" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="48" y="984" text-anchor="start" font-family="Inter" font-size="36" font-weight="400" fill="#515774">Two different debug options</text>
<rect x="48" y="1064" width="560" height="96" rx="12" fill="#D3E8F3" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="328.0" y="1123.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="500" fill="#192147">DEBUG=1</text>
<rect x="792" y="1064" width="560" height="96" rx="12" fill="#D3E8F3" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="1072.0" y="1123.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="500" fill="#192147">package --debug</text>
<path d="M328 1160 L328 1256" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M1072 1160 L1072 1256" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="48" y="1256" width="560" height="144" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="328.0" y="1318.2" text-anchor="middle" font-family="Inter" font-size="32" font-weight="500" fill="#192147">Standard client debug</text>
<text x="328.0" y="1360.2" text-anchor="middle" font-family="Inter" font-size="32" font-weight="500" fill="#192147">Only commands declaring it</text>
<rect x="792" y="1256" width="560" height="144" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="1072.0" y="1318.2" text-anchor="middle" font-family="Inter" font-size="32" font-weight="500" fill="#192147">Packaged agent logging</text>
<text x="1072.0" y="1360.2" text-anchor="middle" font-family="Inter" font-size="32" font-weight="500" fill="#192147">Does not read DEBUG</text>
<path d="M328 1400 L328 1472" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="48" y="1472" width="560" height="80" rx="12" fill="#FBEBDC" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="328.0" y="1522.5" text-anchor="middle" font-family="Inter" font-size="30" font-weight="500" fill="#192147">Request bodies exposed in stderr</text>
</svg>
