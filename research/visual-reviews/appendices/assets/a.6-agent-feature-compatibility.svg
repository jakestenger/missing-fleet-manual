<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1600" viewBox="0 0 1400 1600" role="img">
<title>Successful enrollment does not establish feature compatibility; independent mechanisms are negotiation, ungated settings, local decisions and the Linux escrow version comparison.</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs>
<rect width="1400" height="1600" fill="#F9FAFC"/>
<text x="48" y="80" text-anchor="start" font-family="Inter" font-size="40" font-weight="500" fill="#515774">Enrollment and feature compatibility answer different questions</text>
<rect x="48" y="168" width="1304" height="112" rx="12" fill="#192147" stroke="#192147" stroke-width="2.5"/>
<text x="700.0" y="237.3" text-anchor="middle" font-family="Inter" font-size="38" font-weight="600" fill="#F9FAFC">Enrollment accepted</text>
<text x="700" y="352" text-anchor="middle" font-family="Inter" font-size="30" font-weight="500" fill="#192147">Fleet 4.90.0 has no universal minimum agent-version enrollment gate</text>
<text x="48" y="472" text-anchor="start" font-family="Inter" font-size="36" font-weight="400" fill="#515774">Independent feature paths</text>
<rect x="48" y="560" width="256" height="128" rx="12" fill="#D3E8F3" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="176.0" y="634.5" text-anchor="middle" font-family="Inter" font-size="30" font-weight="500" fill="#192147">Negotiated</text>
<rect x="384" y="560" width="424" height="128" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="596.0" y="634.5" text-anchor="middle" font-family="Inter" font-size="30" font-weight="500" fill="#192147">Named capability advertised</text>
<path d="M808 624 L912 624" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="912" y="560" width="440" height="128" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="1132.0" y="634.5" text-anchor="middle" font-family="Inter" font-size="30" font-weight="500" fill="#192147">Server selects branch</text>
<path d="M304 624 L384 624" fill="none" stroke="#8B8FA2" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="48" y="768" width="256" height="128" rx="12" fill="#D3E8F3" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="176.0" y="842.5" text-anchor="middle" font-family="Inter" font-size="30" font-weight="500" fill="#192147">Ungated</text>
<rect x="384" y="768" width="424" height="128" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="596.0" y="842.5" text-anchor="middle" font-family="Inter" font-size="30" font-weight="500" fill="#192147">Setting sent</text>
<path d="M808 832 L912 832" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="912" y="768" width="440" height="128" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="1132.0" y="842.5" text-anchor="middle" font-family="Inter" font-size="30" font-weight="500" fill="#192147">Older agent may ignore it</text>
<path d="M304 832 L384 832" fill="none" stroke="#8B8FA2" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="48" y="976" width="256" height="128" rx="12" fill="#D3E8F3" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="176.0" y="1050.5" text-anchor="middle" font-family="Inter" font-size="30" font-weight="500" fill="#192147">Chosen locally</text>
<rect x="384" y="976" width="424" height="128" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="596.0" y="1050.5" text-anchor="middle" font-family="Inter" font-size="30" font-weight="500" fill="#192147">Agent / tool decides</text>
<path d="M808 1040 L912 1040" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="912" y="976" width="440" height="128" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="1132.0" y="1050.5" text-anchor="middle" font-family="Inter" font-size="30" font-weight="500" fill="#192147">Feature choice</text>
<path d="M304 1040 L384 1040" fill="none" stroke="#8B8FA2" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="48" y="1184" width="256" height="128" rx="12" fill="#D3E8F3" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="176.0" y="1258.5" text-anchor="middle" font-family="Inter" font-size="30" font-weight="500" fill="#192147">Compared</text>
<rect x="384" y="1184" width="424" height="128" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="596.0" y="1258.5" text-anchor="middle" font-family="Inter" font-size="30" font-weight="500" fill="#192147">Explicit version comparison</text>
<path d="M808 1248 L912 1248" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="912" y="1184" width="440" height="128" rx="12" fill="#FBEBDC" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="1132.0" y="1258.5" text-anchor="middle" font-family="Inter" font-size="30" font-weight="500" fill="#192147">Linux passphrase escrow gate</text>
<path d="M304 1248 L384 1248" fill="none" stroke="#8B8FA2" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="48" y="1400" width="1304" height="144" rx="12" fill="#F9FAFC" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="80" y="1456" text-anchor="start" font-family="Inter" font-size="30" font-weight="400" fill="#515774">osquery protocol has no capability header.</text>
<text x="80" y="1495" text-anchor="start" font-family="Inter" font-size="30" font-weight="400" fill="#515774">Persisted negotiation flag: Windows on-demand sync only.</text>
<path d="M176 688 L24 688 L24 1450 L48 1450" fill="none" stroke="#8B8FA2" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 8"/>
</svg>
