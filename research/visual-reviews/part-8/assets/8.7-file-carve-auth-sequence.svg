<text x="352" y="1624" text-anchor="middle" font-family="Inter" font-size="34" font-weight="600" fill="#192147">Fallback on · default</text>
<rect x="744" y="1560" width="608" height="400" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="1048" y="1624" text-anchor="middle" font-family="Inter" font-size="34" font-weight="600" fill="#192147">Fallback off</text>
<text x="352" y="1704" text-anchor="middle" font-family="Roboto Mono" font-size="30" font-weight="400" fill="#515774">session_id + request_id</text>
<text x="1048" y="1704" text-anchor="middle" font-family="Roboto Mono" font-size="30" font-weight="400" fill="#515774">session_id + request_id</text>
<text x="352" y="1800" text-anchor="middle" font-family="Inter" font-size="28" font-weight="400" fill="#515774">Session identifiers authenticate blocks</text>
<text x="352" y="1836" text-anchor="middle" font-family="Inter" font-size="28" font-weight="400" fill="#515774">No node-key / ownership check</text>
<text x="1048" y="1776" text-anchor="middle" font-family="Inter" font-size="28" font-weight="400" fill="#515774">Also require Authorization node key</text>
<text x="1048" y="1812" text-anchor="middle" font-family="Inter" font-size="28" font-weight="400" fill="#515774">and host ownership match</text>
<text x="700" y="2032" text-anchor="middle" font-family="Inter" font-size="30" font-weight="400" fill="#515774">The two configurations are alternatives; begin authentication stays the same</text>
