<text x="552" y="332" text-anchor="middle" font-family="Inter" font-size="32" font-weight="500" fill="#192147">Begin · node key</text>
<text x="552" y="374" text-anchor="middle" font-family="Inter" font-size="32" font-weight="500" fill="#192147">Declared size + block count</text>
<rect x="1032" y="324" width="320" height="160" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="1192.0" y="375.5" text-anchor="middle" font-family="Inter" font-size="30" font-weight="500" fill="#192147">Validate declared</text>
<text x="1192.0" y="414.5" text-anchor="middle" font-family="Inter" font-size="30" font-weight="500" fill="#192147">size and blocks</text>
<text x="1192.0" y="453.5" text-anchor="middle" font-family="Inter" font-size="30" font-weight="500" fill="#192147">Record session</text>
