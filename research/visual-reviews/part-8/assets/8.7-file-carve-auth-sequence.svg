<text x="1192" y="728" text-anchor="middle" font-family="Inter" font-size="30" font-weight="400" fill="#515774">Ordered blocks</text>
<text x="1192" y="767" text-anchor="middle" font-family="Inter" font-size="30" font-weight="400" fill="#515774">Within declared</text>
<text x="1192" y="806" text-anchor="middle" font-family="Inter" font-size="30" font-weight="400" fill="#515774">size</text>
