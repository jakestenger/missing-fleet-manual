<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="2064" viewBox="0 0 1400 2064" role="img">
<title>The begin request uses the osquery node key; ordered block authentication depends on body-auth fallback configuration, with header and ownership checks when disabled.</title>
