<rect x="48" y="1424" width="1304" height="80" rx="12" fill="#D3E8F3" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="700" y="1476" text-anchor="middle" font-family="Inter" font-size="32" font-weight="500" fill="#192147">Block authentication is selected by server configuration</text>
