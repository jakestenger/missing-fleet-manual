<path d="M888 568 L216 568" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="552" y="530" text-anchor="middle" font-family="Inter" font-size="32" font-weight="500" fill="#192147">Return session identifiers</text>
<path d="M216 736 L888 736" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="552" y="696" text-anchor="middle" font-family="Inter" font-size="34" font-weight="500" fill="#192147">Block 1</text>
