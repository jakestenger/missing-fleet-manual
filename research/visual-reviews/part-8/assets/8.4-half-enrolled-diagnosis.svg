<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1464" viewBox="0 0 1400 1464" role="img">
<title>On a half-enrolled Mac, the OS enrollment record and missing fleetd are separate; MDM result freshness determines whether an MDM-delivered reinstall can work.</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs>
<rect width="1400" height="1464" fill="#F9FAFC"/>
<text x="48" y="80" text-anchor="start" font-family="Inter" font-size="40" font-weight="500" fill="#515774">Check the MDM path on a half-enrolled Mac</text>
<rect x="48" y="176" width="448" height="392" rx="12" fill="#F9FAFC" stroke="#192147" stroke-width="2.5"/>
<text x="80" y="240" text-anchor="start" font-family="Inter" font-size="36" font-weight="500" fill="#515774">macOS device</text>
<rect x="80" y="284" width="384" height="112" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="272.0" y="351.2" text-anchor="middle" font-family="Inter" font-size="32" font-weight="500" fill="#192147">OS MDM enrollment</text>
<rect x="80" y="424" width="384" height="112" rx="12" fill="#F6E4E8" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="272.0" y="491.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="500" fill="#192147">fleetd missing</text>
<rect x="688" y="284" width="664" height="112" rx="12" fill="#D3E8F3" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="1020.0" y="351.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="500" fill="#192147">MDM enrollment: On</text>
<path d="M688 340 L464 340" fill="none" stroke="#8B8FA2" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="688" y="480" text-anchor="start" font-family="Inter" font-size="30" font-weight="500" fill="#515774">Enrollment record</text>
<text x="688" y="519" text-anchor="start" font-family="Inter" font-size="30" font-weight="500" fill="#515774">Current channel health still needs checking</text>
<rect x="48" y="688" width="1304" height="128" rx="12" fill="#192147" stroke="#192147" stroke-width="2.5"/>
<text x="700.0" y="764.6" text-anchor="middle" font-family="Inter" font-size="36" font-weight="600" fill="#F9FAFC">MDM enrollment On + missing agent reports</text>
<path d="M700 816 L700 880" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="384" y="880" width="632" height="144" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="700.0" y="941.1" text-anchor="middle" font-family="Inter" font-size="36" font-weight="500" fill="#192147">Recent MDM commands</text>
<text x="700.0" y="988.1" text-anchor="middle" font-family="Inter" font-size="36" font-weight="500" fill="#192147">receiving results?</text>
<path d="M384 952 L260 952 L260 1136" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="296" y="920" text-anchor="middle" font-family="Inter" font-size="30" font-weight="500" fill="#192147">Yes</text>
<path d="M1016 952 L1156 952 L1156 1136" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="1100" y="920" text-anchor="middle" font-family="Inter" font-size="30" font-weight="500" fill="#192147">No</text>
<rect x="48" y="1136" width="584" height="216" rx="12" fill="#D8FBEF" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="340.0" y="1233.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="500" fill="#192147">MDM path works</text>
<text x="340.0" y="1277.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="500" fill="#192147">Investigate / install fleetd</text>
<rect x="768" y="1136" width="584" height="216" rx="12" fill="#FBEBDC" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="1060.0" y="1215.5" text-anchor="middle" font-family="Inter" font-size="30" font-weight="500" fill="#192147">Two independent faults</text>
<text x="1060.0" y="1254.5" text-anchor="middle" font-family="Inter" font-size="30" font-weight="500" fill="#192147">Repair MDM reachability before</text>
<text x="1060.0" y="1293.5" text-anchor="middle" font-family="Inter" font-size="30" font-weight="500" fill="#192147">relying on MDM agent reinstall</text>
</svg>
