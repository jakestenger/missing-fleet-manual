<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1544" viewBox="0 0 1400 1544" role="img">
<title>A scoped logging investigation captures the existing value, confirms activation, collects evidence, restores the prior value and confirms restoration.</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs>
<rect width="1400" height="1544" fill="#F9FAFC"/>
<text x="48" y="80" text-anchor="start" font-family="Inter" font-size="40" font-weight="500" fill="#515774">Bound the diagnostic logging window</text>
<rect x="1056" y="424" width="296" height="612" rx="12" fill="#FBEBDC" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="1204" y="650" text-anchor="middle" font-family="Inter" font-size="34" font-weight="600" fill="#192147">Elevated</text>
<text x="1204" y="694" text-anchor="middle" font-family="Inter" font-size="34" font-weight="600" fill="#192147">logging</text>
<text x="1204" y="738" text-anchor="middle" font-family="Inter" font-size="34" font-weight="600" fill="#192147">window</text>
<rect x="280" y="168" width="696" height="112" rx="12" fill="#192147" stroke="#192147" stroke-width="2.5"/>
<text x="628.0" y="236.6" text-anchor="middle" font-family="Inter" font-size="36" font-weight="600" fill="#F9FAFC">Record existing setting</text>
<path d="M628 280 L628 372" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="280" y="372" width="696" height="112" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="628.0" y="440.6" text-anchor="middle" font-family="Inter" font-size="36" font-weight="500" fill="#192147">Enable scoped verbosity</text>
<path d="M628 484 L628 576" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="280" y="576" width="696" height="112" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="628.0" y="644.6" text-anchor="middle" font-family="Inter" font-size="36" font-weight="500" fill="#192147">Confirm it took effect</text>
<path d="M628 688 L628 780" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="280" y="780" width="696" height="112" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="628.0" y="848.6" text-anchor="middle" font-family="Inter" font-size="36" font-weight="500" fill="#192147">Reproduce and capture</text>
<path d="M628 892 L628 984" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="280" y="984" width="696" height="112" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="628.0" y="1052.6" text-anchor="middle" font-family="Inter" font-size="36" font-weight="500" fill="#192147">Restore prior setting</text>
<path d="M628 1096 L628 1188" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="280" y="1188" width="696" height="112" rx="12" fill="#192147" stroke="#192147" stroke-width="2.5"/>
<text x="628.0" y="1256.6" text-anchor="middle" font-family="Inter" font-size="36" font-weight="600" fill="#F9FAFC">Confirm restoration</text>
<rect x="48" y="488" width="200" height="80" rx="12" fill="#FBEBDC" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="148.0" y="538.5" text-anchor="middle" font-family="Inter" font-size="30" font-weight="500" fill="#192147">Restart*</text>
<path d="M248 528 L628 528" fill="none" stroke="#8B8FA2" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 7"/>
<rect x="48" y="1100" width="200" height="80" rx="12" fill="#FBEBDC" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="148.0" y="1150.5" text-anchor="middle" font-family="Inter" font-size="30" font-weight="500" fill="#192147">Restart*</text>
<path d="M248 1140 L628 1140" fill="none" stroke="#8B8FA2" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 7"/>
<text x="48" y="1400" text-anchor="start" font-family="Inter" font-size="30" font-weight="500" fill="#515774">* Only where the selected lever requires a restart.</text>
<text x="48" y="1439" text-anchor="start" font-family="Inter" font-size="30" font-weight="500" fill="#515774">Restore the captured prior value.</text>
</svg>
