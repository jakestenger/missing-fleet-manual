<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1872" viewBox="0 0 1400 1872" role="img">
<title>The enrollment’s poll schedule and a capable fleetd’s gated on-demand wake independently cause device-initiated Windows MDM sessions; a poll-change command carries intent until acknowledged.</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs>
<rect width="1400" height="1872" fill="#F9FAFC"/>
<text x="48" y="80" text-anchor="start" font-family="Inter" font-size="40" font-weight="500" fill="#515774">Windows MDM can connect between timer polls</text>
<rect x="48" y="176" width="568" height="968" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="80" y="244" text-anchor="start" font-family="Inter" font-size="36" font-weight="500" fill="#515774">Timer path</text>
<rect x="80" y="312" width="504" height="176" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="332.0" y="389.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="500" fill="#192147">Per-enrollment choice</text>
<text x="332.0" y="433.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="500" fill="#192147">Stored fleetd capability</text>
<path d="M332 488 L332 576" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="80" y="576" width="504" height="272" rx="12" fill="#D3E8F3" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="332.0" y="644.5" text-anchor="middle" font-family="Inter" font-size="30" font-weight="500" fill="#192147">Fast default: 1 minute</text>
<text x="332.0" y="683.5" text-anchor="middle" font-family="Inter" font-size="30" font-weight="500" fill="#192147">No on-demand sync</text>
<text x="332.0" y="722.5" text-anchor="middle" font-family="Inter" font-size="30" font-weight="500" fill="#192147"></text>
<text x="332.0" y="761.5" text-anchor="middle" font-family="Inter" font-size="30" font-weight="500" fill="#192147">Relaxed: 480 minutes</text>
<text x="332.0" y="800.5" text-anchor="middle" font-family="Inter" font-size="30" font-weight="500" fill="#192147">Sync-capable fleetd</text>
<path d="M332 848 L332 928" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="80" y="928" width="504" height="128" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="332.0" y="1004.6" text-anchor="middle" font-family="Inter" font-size="36" font-weight="500" fill="#192147">Device timer fires</text>
<rect x="784" y="176" width="568" height="968" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="816" y="244" text-anchor="start" font-family="Inter" font-size="36" font-weight="500" fill="#515774">On-demand path</text>
<rect x="816" y="312" width="504" height="144" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="1068.0" y="373.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="500" fill="#192147">Fleet queues</text>
<text x="1068.0" y="417.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="500" fill="#192147">a non-poll command</text>
<path d="M1068 456 L1068 552" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="816" y="552" width="504" height="176" rx="12" fill="#FBEBDC" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="1068.0" y="611.5" text-anchor="middle" font-family="Inter" font-size="30" font-weight="500" fill="#192147">Next fleetd config check-in</text>
<text x="1068.0" y="650.5" text-anchor="middle" font-family="Inter" font-size="30" font-weight="500" fill="#192147">Advertises sync capability</text>
<text x="1068.0" y="689.5" text-anchor="middle" font-family="Inter" font-size="30" font-weight="500" fill="#192147">Outside setup hold</text>
<path d="M1068 728 L1068 800" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="816" y="800" width="504" height="112" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="1068.0" y="867.2" text-anchor="middle" font-family="Inter" font-size="32" font-weight="500" fill="#192147">Receives sync request</text>
<path d="M1068 912 L1068 976" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="816" y="976" width="504" height="112" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="1068.0" y="1042.5" text-anchor="middle" font-family="Inter" font-size="30" font-weight="500" fill="#192147">fleetd wakes Windows MDM</text>
<path d="M332 1056 L332 1200 L524 1200 L524 1296" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M1068 1088 L1068 1200 L876 1200 L876 1296" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="352" y="1296" width="696" height="144" rx="12" fill="#192147" stroke="#192147" stroke-width="2.5"/>
<text x="700.0" y="1380.6" text-anchor="middle" font-family="Inter" font-size="36" font-weight="600" fill="#F9FAFC">Device opens an OMA-DM session</text>
<text x="48" y="1552" text-anchor="start" font-family="Inter" font-size="36" font-weight="500" fill="#515774">Separate poll-change command</text>
<rect x="48" y="1616" width="472" height="120" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="284.0" y="1687.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="500" fill="#192147">Desired poll interval</text>
<rect x="872" y="1616" width="480" height="120" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="1112.0" y="1687.2" text-anchor="middle" font-family="Inter" font-size="32" font-weight="500" fill="#192147">Device acknowledgement</text>
<path d="M520 1676 L872 1676" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="696" y="1640" text-anchor="middle" font-family="Inter" font-size="28" font-weight="500" fill="#192147">Apply command</text>
<text x="700" y="1824" text-anchor="middle" font-family="Inter" font-size="30" font-weight="400" fill="#515774">Stored poll intent does not confirm application or request an on-demand wake</text>
</svg>
