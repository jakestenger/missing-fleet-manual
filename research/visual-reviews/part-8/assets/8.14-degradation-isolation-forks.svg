<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1512" viewBox="0 0 1400 1512" role="img">
<title>Independent controlled experiments test volume and query-cost hypotheses; another workload’s change suggests contention, while documented limits are inspected before capacity testing.</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs>
<rect width="1400" height="1512" fill="#F9FAFC"/>
<text x="48" y="80" text-anchor="start" font-family="Inter" font-size="40" font-weight="500" fill="#515774">Separate volume, query cost and contention hypotheses</text>
<rect x="48" y="168" width="584" height="112" rx="12" fill="#D8FBEF" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="340.0" y="236.6" text-anchor="middle" font-family="Inter" font-size="36" font-weight="500" fill="#192147">Passing control</text>
<rect x="768" y="168" width="584" height="112" rx="12" fill="#F6E4E8" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="1060.0" y="236.6" text-anchor="middle" font-family="Inter" font-size="36" font-weight="500" fill="#192147">Failing workload</text>
<text x="48" y="392" text-anchor="start" font-family="Inter" font-size="32" font-weight="500" fill="#515774">Separate experiments · keep the untested axes constant</text>
<rect x="48" y="456" width="608" height="144" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="352.0" y="517.1" text-anchor="middle" font-family="Inter" font-size="36" font-weight="500" fill="#192147">Same content</text>
<text x="352.0" y="564.1" text-anchor="middle" font-family="Inter" font-size="36" font-weight="500" fill="#192147">Smaller target set</text>
<rect x="744" y="456" width="608" height="144" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="1048.0" y="517.1" text-anchor="middle" font-family="Inter" font-size="36" font-weight="500" fill="#192147">Same targets</text>
<text x="1048.0" y="564.1" text-anchor="middle" font-family="Inter" font-size="36" font-weight="500" fill="#192147">Simpler query</text>
<path d="M352 600 L352 752" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="400" y="696" text-anchor="start" font-family="Inter" font-size="30" font-weight="500" fill="#515774">If improved</text>
<path d="M1048 600 L1048 752" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="1096" y="696" text-anchor="start" font-family="Inter" font-size="30" font-weight="500" fill="#515774">If improved</text>
<rect x="48" y="752" width="608" height="144" rx="12" fill="#FBEBDC" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="352.0" y="813.1" text-anchor="middle" font-family="Inter" font-size="36" font-weight="500" fill="#192147">Limit / scale</text>
<text x="352.0" y="860.1" text-anchor="middle" font-family="Inter" font-size="36" font-weight="500" fill="#192147">Hypothesis to test</text>
<rect x="744" y="752" width="608" height="144" rx="12" fill="#FBEBDC" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="1048.0" y="813.1" text-anchor="middle" font-family="Inter" font-size="36" font-weight="500" fill="#192147">Query cost</text>
<text x="1048.0" y="860.1" text-anchor="middle" font-family="Inter" font-size="36" font-weight="500" fill="#192147">Hypothesis to test</text>
<path d="M352 896 L352 992" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="48" y="992" width="608" height="136" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="352.0" y="1049.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="500" fill="#192147">Inspect documented ceilings</text>
<text x="352.0" y="1093.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="500" fill="#192147">and quotas</text>
<path d="M352 1128 L352 1200" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="48" y="1200" width="608" height="104" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="352.0" y="1263.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="500" fill="#192147">Then capacity test</text>
<rect x="744" y="1064" width="608" height="112" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="1048.0" y="1131.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="500" fill="#192147">Other workload changed</text>
<path d="M1048 1176 L1048 1240" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="744" y="1240" width="608" height="144" rx="12" fill="#FBEBDC" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="1048.0" y="1301.1" text-anchor="middle" font-family="Inter" font-size="36" font-weight="500" fill="#192147">Contention</text>
<text x="1048.0" y="1348.1" text-anchor="middle" font-family="Inter" font-size="36" font-weight="500" fill="#192147">Hypothesis to test</text>
<text x="700" y="1472" text-anchor="middle" font-family="Inter" font-size="30" font-weight="400" fill="#515774">Select a bounded test for the hypothesis; preserve resource and security controls</text>
</svg>
