<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1312" viewBox="0 0 1400 1312" role="img">
<title>Individual record and arrival timestamps give different investigative leads for buffered delivery and stale consumption.</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs>
<rect width="1400" height="1312" fill="#F9FAFC"/>
