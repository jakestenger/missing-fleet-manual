<text x="700.0" y="719.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="500" fill="#192147">Check host buffering and recent reconnection</text>
<text x="48" y="824" text-anchor="start" font-family="Inter" font-size="36" font-weight="500" fill="#515774">B · old record, old arrival</text>
