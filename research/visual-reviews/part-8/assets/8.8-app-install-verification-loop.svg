<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1464" viewBox="0 0 1400 1464" role="img">
<title>An acknowledged App Store install enters repeated verification requests; timeout needs API metadata inspection and does not alone establish the install outcome.</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs>
<rect width="1400" height="1464" fill="#F9FAFC"/>
<text x="48" y="80" text-anchor="start" font-family="Inter" font-size="40" font-weight="500" fill="#515774">Acknowledged app installs still need verification</text>
<rect x="48" y="184" width="472" height="112" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="284.0" y="251.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="500" fill="#192147">InstallApplication</text>
<path d="M520 240 L720 240" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="720" y="184" width="632" height="112" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="1036.0" y="252.6" text-anchor="middle" font-family="Inter" font-size="36" font-weight="500" fill="#192147">Acknowledged</text>
<path d="M1036 296 L1036 392 L444 392 L444 496" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="48" y="496" width="792" height="160" rx="12" fill="#192147" stroke="#192147" stroke-width="2.5"/>
<text x="444.0" y="565.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="600" fill="#F9FAFC">InstalledApplicationList</text>
<text x="444.0" y="609.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="600" fill="#F9FAFC">Verification request</text>
<rect x="1016" y="496" width="336" height="160" rx="12" fill="#FBEBDC" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="1184.0" y="547.5" text-anchor="middle" font-family="Inter" font-size="30" font-weight="500" fill="#192147">Defaults</text>
<text x="1184.0" y="586.5" text-anchor="middle" font-family="Inter" font-size="30" font-weight="500" fill="#192147">10 min timeout</text>
<text x="1184.0" y="625.5" text-anchor="middle" font-family="Inter" font-size="30" font-weight="500" fill="#192147">5 s request delay</text>
<path d="M840 576 L1016 576" fill="none" stroke="#8B8FA2" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 7"/>
<path d="M444 656 L444 764" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="48" y="764" width="792" height="112" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="444.0" y="831.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="500" fill="#192147">Installed, or verification timeout?</text>
<path d="M48 820 L24 820 L24 448 L444 448 L444 496" fill="none" stroke="#8B8FA2" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 7" marker-end="url(#arrow)"/>
<text x="72" y="716" text-anchor="start" font-family="Inter" font-size="30" font-weight="500" fill="#515774">Neither yet: request again</text>
<path d="M244 876 L244 992" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="324" y="940" text-anchor="middle" font-family="Inter" font-size="28" font-weight="500" fill="#192147">Installed</text>
<path d="M648 876 L648 936 L1104 936 L1104 992" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="840" y="902" text-anchor="middle" font-family="Inter" font-size="28" font-weight="500" fill="#192147">Timeout</text>
<rect x="48" y="992" width="520" height="128" rx="12" fill="#D8FBEF" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="308.0" y="1067.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="500" fill="#192147">App observed installed</text>
<rect x="856" y="992" width="496" height="128" rx="12" fill="#FBEBDC" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="1104.0" y="1067.2" text-anchor="middle" font-family="Inter" font-size="32" font-weight="500" fill="#192147">Inspect API result metadata</text>
<rect x="48" y="1216" width="1304" height="192" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="80" y="1276" text-anchor="start" font-family="Roboto Mono" font-size="30" font-weight="400" fill="#515774">software_installed</text>
<text x="80" y="1332" text-anchor="start" font-family="Roboto Mono" font-size="30" font-weight="400" fill="#515774">vpp_verify_timeout_seconds</text>
<text x="848" y="1276" text-anchor="start" font-family="Inter" font-size="28" font-weight="500" fill="#515774">fleetctl omits these fields</text>
<text x="848" y="1312" text-anchor="start" font-family="Inter" font-size="28" font-weight="500" fill="#515774">Device response timing varies</text>
<path d="M1104 1120 L1104 1216" fill="none" stroke="#8B8FA2" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
</svg>
