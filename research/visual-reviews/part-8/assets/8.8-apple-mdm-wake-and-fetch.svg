<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1856" viewBox="0 0 1400 1856" role="img">
<title>APNs wakes an Apple device, while commands and results travel directly between the device and Fleet; NotNow defers selection and terminal results do not deactivate the queue row.</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs>
<rect width="1400" height="1856" fill="#F9FAFC"/>
<text x="48" y="80" text-anchor="start" font-family="Inter" font-size="40" font-weight="500" fill="#515774">Apple devices fetch commands directly from Fleet</text>
<rect x="48" y="160" width="336" height="104" rx="12" fill="#192147" stroke="#192147" stroke-width="2.5"/>
<text x="216.0" y="224.6" text-anchor="middle" font-family="Inter" font-size="36" font-weight="600" fill="#F9FAFC">Fleet</text>
<path d="M216 264 L216 1376" fill="none" stroke="#8B8FA2" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 7"/>
<rect x="536" y="160" width="336" height="104" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="704.0" y="224.6" text-anchor="middle" font-family="Inter" font-size="36" font-weight="500" fill="#192147">APNs</text>
<path d="M704 264 L704 704" fill="none" stroke="#8B8FA2" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 7"/>
<rect x="1016" y="160" width="336" height="104" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="1184.0" y="224.6" text-anchor="middle" font-family="Inter" font-size="36" font-weight="500" fill="#192147">Apple device</text>
<path d="M1184 264 L1184 1376" fill="none" stroke="#8B8FA2" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 7"/>
<rect x="48" y="336" width="336" height="112" rx="12" fill="#D3E8F3" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="216.0" y="403.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="500" fill="#192147">Queued command</text>
<path d="M216 532 L704 532" fill="none" stroke="#8B8FA2" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="460" y="500" text-anchor="middle" font-family="Inter" font-size="30" font-weight="500" fill="#192147">Wake request</text>
<path d="M704 652 L1184 652" fill="none" stroke="#8B8FA2" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="944" y="614" text-anchor="middle" font-family="Inter" font-size="30" font-weight="500" fill="#192147">Wake notification</text>
<text x="328" y="596" text-anchor="start" font-family="Inter" font-size="28" font-weight="500" fill="#515774">No per-device push</text>
<text x="328" y="632" text-anchor="start" font-family="Inter" font-size="28" font-weight="500" fill="#515774">outcome persisted</text>
<path d="M1184 820 L216 820" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="700" y="780" text-anchor="middle" font-family="Inter" font-size="34" font-weight="500" fill="#192147">Authenticated MDM connection</text>
<path d="M216 992 L1184 992" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="700" y="952" text-anchor="middle" font-family="Inter" font-size="34" font-weight="500" fill="#192147">Command on that connection</text>
<path d="M1184 1164 L216 1164" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="700" y="1124" text-anchor="middle" font-family="Inter" font-size="34" font-weight="500" fill="#192147">Result directly to Fleet</text>
<rect x="48" y="1424" width="552" height="144" rx="12" fill="#FBEBDC" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="324.0" y="1487.0" text-anchor="middle" font-family="Inter" font-size="30" font-weight="500" fill="#192147">NotNow</text>
<text x="324.0" y="1526.0" text-anchor="middle" font-family="Inter" font-size="30" font-weight="500" fill="#192147">Eligible at a later Idle check-in</text>
<path d="M216 1164 L216 1424" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M48 1496 L24 1496 L24 392 L48 392" fill="none" stroke="#8B8FA2" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 7" marker-end="url(#arrow)"/>
<rect x="800" y="1424" width="552" height="144" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="1076.0" y="1487.8" text-anchor="middle" font-family="Inter" font-size="28" font-weight="500" fill="#192147">Terminal result</text>
<text x="1076.0" y="1523.8" text-anchor="middle" font-family="Inter" font-size="28" font-weight="500" fill="#192147">Stops selection; queue row stays active</text>
<path d="M216 1264 L1076 1264 L1076 1424" fill="none" stroke="#8B8FA2" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M1076 1568 L1076 1664" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="800" y="1664" width="552" height="128" rx="12" fill="#D3E8F3" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="1076.0" y="1719.0" text-anchor="middle" font-family="Inter" font-size="30" font-weight="500" fill="#192147">Fleet interprets profile result</text>
<text x="1076.0" y="1758.0" text-anchor="middle" font-family="Inter" font-size="30" font-weight="500" fill="#192147">Verification follows separately</text>
</svg>
