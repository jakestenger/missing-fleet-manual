<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="936" viewBox="0 0 1400 936" role="img">
<title>Windows recovery-key ciphertext is tied to the encrypting certificate issuer and serial, even if a renewed certificate uses the same key pair.</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs>
<rect width="1400" height="936" fill="#F9FAFC"/>
<text x="48" y="80" text-anchor="start" font-family="Inter" font-size="40" font-weight="500" fill="#515774">Windows escrow: certificate identity matters</text>
<rect x="48" y="160" width="300" height="140" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="198.0" y="219.1" text-anchor="middle" font-family="Inter" font-size="36" font-weight="500" fill="#192147">Windows</text>
<text x="198.0" y="266.1" text-anchor="middle" font-family="Inter" font-size="36" font-weight="500" fill="#192147">recovery key</text>
<path d="M348 230 L444 230" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="444" y="160" width="380" height="140" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="634.0" y="219.1" text-anchor="middle" font-family="Inter" font-size="36" font-weight="500" fill="#192147">Encrypted using</text>
<text x="634.0" y="266.1" text-anchor="middle" font-family="Inter" font-size="36" font-weight="500" fill="#192147">Certificate A</text>
<path d="M824 230 L920 230" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="920" y="144" width="432" height="172" rx="12" fill="#192147" stroke="#192147" stroke-width="2.5"/>
<text x="1136.0" y="219.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="600" fill="#F9FAFC">Stored ciphertext</text>
<text x="1136.0" y="263.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="600" fill="#F9FAFC">Issuer / serial: A</text>
<path d="M1136 316 L1136 390 L358 390 L358 474" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M1136 390 L1042 390 L1042 474" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="48" y="474" width="620" height="140" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="358.0" y="533.1" text-anchor="middle" font-family="Inter" font-size="36" font-weight="500" fill="#192147">Current certificate A</text>
<text x="358.0" y="580.1" text-anchor="middle" font-family="Inter" font-size="36" font-weight="500" fill="#192147">+ private key</text>
<rect x="732" y="474" width="620" height="140" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="1042.0" y="533.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="500" fill="#192147">Renewed certificate B</text>
<text x="1042.0" y="577.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="500" fill="#192147">even with the same key pair</text>
<path d="M358 614 L358 708" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M1042 614 L1042 708" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="48" y="708" width="620" height="108" rx="12" fill="#D8FBEF" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="358.0" y="775.3" text-anchor="middle" font-family="Inter" font-size="38" font-weight="500" fill="#192147">Decrypts</text>
<rect x="732" y="708" width="620" height="108" rx="12" fill="#F6E4E8" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="1042.0" y="775.3" text-anchor="middle" font-family="Inter" font-size="38" font-weight="500" fill="#192147">Identity mismatch</text>
<text x="1042" y="878" text-anchor="middle" font-family="Inter" font-size="28" font-weight="400" fill="#515774">Old escrow may still look available</text>
</svg>
