<rect x="1132" y="528" width="220" height="82" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="1242.0" y="560.0" text-anchor="middle" font-family="Inter" font-size="30" font-weight="500" fill="#192147">Metered</text>
