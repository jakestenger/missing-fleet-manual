<text x="700.0" y="469.6" text-anchor="middle" font-family="Inter" font-size="36" font-weight="600" fill="#F9FAFC">Exported data volume</text>
<path d="M700 512 L700 566 L850 566" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="850" y="528" width="220" height="82" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
