<text x="240.0" y="220.8" text-anchor="middle" font-family="Inter" font-size="38" font-weight="500" fill="#192147">Hosts</text>
<text x="240.0" y="269.8" text-anchor="middle" font-family="Inter" font-size="38" font-weight="500" fill="#192147">reporting</text>
