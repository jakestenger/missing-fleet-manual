<text x="700.0" y="269.8" text-anchor="middle" font-family="Inter" font-size="38" font-weight="500" fill="#192147">period</text>
<rect x="968" y="160" width="384" height="144" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="1160.0" y="220.8" text-anchor="middle" font-family="Inter" font-size="38" font-weight="500" fill="#192147">Bytes per</text>
<text x="1160.0" y="269.8" text-anchor="middle" font-family="Inter" font-size="38" font-weight="500" fill="#192147">result</text>
<text x="470" y="246" text-anchor="middle" font-family="Inter" font-size="46" font-weight="500" fill="#192147">×</text>
<text x="930" y="246" text-anchor="middle" font-family="Inter" font-size="46" font-weight="500" fill="#192147">×</text>
<path d="M240 304 L240 354 L700 354 L700 402" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
