<text x="1226.0" y="270.2" text-anchor="middle" font-family="Inter" font-size="32" font-weight="500" fill="#192147">destination</text>
<text x="542" y="350" text-anchor="middle" font-family="Inter" font-size="28" font-weight="400" fill="#515774">Premium · off by default</text>
