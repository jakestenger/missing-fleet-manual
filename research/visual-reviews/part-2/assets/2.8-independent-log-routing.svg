<text x="904.0" y="947.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="500" fill="#192147">plugin</text>
<rect x="1100" y="858" width="252" height="112" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="1226.0" y="904.2" text-anchor="middle" font-family="Inter" font-size="32" font-weight="500" fill="#192147">Status</text>
<text x="1226.0" y="946.2" text-anchor="middle" font-family="Inter" font-size="32" font-weight="500" fill="#192147">destination</text>
<text x="700" y="1032" text-anchor="middle" font-family="Inter" font-size="30" font-weight="400" fill="#515774">osquery destinations are independent; filesystem is the default</text>
