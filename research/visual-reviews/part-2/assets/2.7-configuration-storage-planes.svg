<text x="358" y="870" text-anchor="middle" font-family="Inter" font-size="34" font-weight="400" fill="#515774">Apply while running</text>
<rect x="784" y="176" width="516" height="348" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="1042" y="228" text-anchor="middle" font-family="Inter" font-size="30" font-weight="600" fill="#192147">Precedence</text>
