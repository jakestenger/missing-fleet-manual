<text x="80" y="112" text-anchor="start" font-family="Inter" font-size="38" font-weight="500" fill="#515774">Organization settings</text>
<text x="764" y="112" text-anchor="start" font-family="Inter" font-size="38" font-weight="500" fill="#515774">Server settings</text>
