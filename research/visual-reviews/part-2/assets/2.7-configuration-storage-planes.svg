<text x="1042" y="332" text-anchor="middle" font-family="Inter" font-size="32" font-weight="500" fill="#192147">↓</text>
<text x="1042" y="374" text-anchor="middle" font-family="Inter" font-size="32" font-weight="500" fill="#192147">Environment</text>
