<text x="358.0" y="485.1" text-anchor="middle" font-family="Inter" font-size="36" font-weight="500" fill="#192147">configuration</text>
<text x="358" y="580" text-anchor="middle" font-family="Inter" font-size="28" font-weight="400" fill="#515774">Some enablement fields</text>
<text x="358" y="616" text-anchor="middle" font-family="Inter" font-size="28" font-weight="400" fill="#515774">are restored by Fleet</text>
<path d="M358 524 L358 542 L640 542 L640 672 L358 672 L358 710" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
