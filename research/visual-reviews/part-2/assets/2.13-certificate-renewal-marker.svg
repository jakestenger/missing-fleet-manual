<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="966" viewBox="0 0 1400 966" role="img">
<title>Supported proxied SCEP profiles use a subject marker and companion URL/challenge variables to let Fleet track renewal.</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs>
<rect width="1400" height="966" fill="#F9FAFC"/>
<text x="48" y="80" text-anchor="start" font-family="Inter" font-size="40" font-weight="500" fill="#515774">Supported proxied SCEP profile paths</text>
<text x="48" y="134" text-anchor="start" font-family="Inter" font-size="28" font-weight="500" fill="#515774">NDES · custom SCEP · Smallstep, where the platform supports them</text>
<rect x="48" y="242" width="292" height="156" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="194.0" y="311.0" text-anchor="middle" font-family="Inter" font-size="30" font-weight="500" fill="#192147">Profile subject:</text>
<text x="194.0" y="350.0" text-anchor="middle" font-family="Inter" font-size="30" font-weight="500" fill="#192147">renewal identifier</text>
<rect x="412" y="242" width="292" height="156" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="558.0" y="311.0" text-anchor="middle" font-family="Inter" font-size="30" font-weight="500" fill="#192147">Issued host</text>
<text x="558.0" y="350.0" text-anchor="middle" font-family="Inter" font-size="30" font-weight="500" fill="#192147">certificate</text>
<rect x="776" y="242" width="292" height="156" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="922.0" y="311.0" text-anchor="middle" font-family="Inter" font-size="30" font-weight="500" fill="#192147">Host reports</text>
<text x="922.0" y="350.0" text-anchor="middle" font-family="Inter" font-size="30" font-weight="500" fill="#192147">certificate</text>
<rect x="1140" y="242" width="212" height="156" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="1246.0" y="291.5" text-anchor="middle" font-family="Inter" font-size="30" font-weight="500" fill="#192147">Fleet checks</text>
<text x="1246.0" y="330.5" text-anchor="middle" font-family="Inter" font-size="30" font-weight="500" fill="#192147">marker +</text>
<text x="1246.0" y="369.5" text-anchor="middle" font-family="Inter" font-size="30" font-weight="500" fill="#192147">expiry</text>
<path d="M340 320 L412 320" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M704 320 L776 320" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M1068 320 L1140 320" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M1246 398 L1246 522 L194 522 L194 398" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="718" y="498" text-anchor="middle" font-family="Inter" font-size="32" font-weight="400" fill="#515774">Renewal management</text>
<rect x="48" y="582" width="596" height="114" rx="12" fill="#F9FAFC" stroke="#C5C7D1" stroke-width="2.5" stroke-dasharray="7 7"/>
<text x="80" y="628" text-anchor="start" font-family="Inter" font-size="28" font-weight="500" fill="#515774">Prerequisite: matching family URL</text>
<text x="80" y="669" text-anchor="start" font-family="Inter" font-size="28" font-weight="500" fill="#515774">and challenge variables</text>
<path d="M48 640 L24 640 L24 320 L48 320" fill="none" stroke="#8B8FA2" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 7" marker-end="url(#arrow)"/>
<rect x="48" y="766" width="480" height="138" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="288.0" y="824.1" text-anchor="middle" font-family="Inter" font-size="36" font-weight="500" fill="#192147">Without renewal</text>
<text x="288.0" y="871.1" text-anchor="middle" font-family="Inter" font-size="36" font-weight="500" fill="#192147">identifier</text>
<path d="M528 835 L684 835" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="684" y="766" width="668" height="138" rx="12" fill="#FBEBDC" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="1018.0" y="824.1" text-anchor="middle" font-family="Inter" font-size="36" font-weight="500" fill="#192147">Working certificate</text>
<text x="1018.0" y="871.1" text-anchor="middle" font-family="Inter" font-size="36" font-weight="500" fill="#192147">No automatic renewal</text>
</svg>
