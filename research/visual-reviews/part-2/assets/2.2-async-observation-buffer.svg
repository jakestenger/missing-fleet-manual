<rect x="1092" y="388" width="260" height="136" rx="12" fill="#192147" stroke="#192147" stroke-width="2.5"/>
<text x="1222.0" y="445.1" text-anchor="middle" font-family="Inter" font-size="36" font-weight="600" fill="#F9FAFC">MySQL</text>
<text x="1222.0" y="492.1" text-anchor="middle" font-family="Inter" font-size="36" font-weight="600" fill="#F9FAFC">writer</text>
<path d="M308 426 L356 426 L356 282 L460 282" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M924 282 L1000 282 L1000 426 L1092 426" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="460" y="228" width="464" height="108" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="692.0" y="294.6" text-anchor="middle" font-family="Inter" font-size="36" font-weight="500" fill="#192147">Observations inline</text>
<text x="460" y="208" text-anchor="start" font-family="Inter" font-size="30" font-weight="500" fill="#515774">Default: synchronous</text>
<path d="M308 482 L356 482 L356 588 L460 588" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="460" y="536" width="220" height="104" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="570.0" y="577.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="500" fill="#192147">Redis</text>
<text x="570.0" y="621.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="500" fill="#192147">buffer</text>
<path d="M680 588 L752 588" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="752" y="536" width="220" height="104" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
