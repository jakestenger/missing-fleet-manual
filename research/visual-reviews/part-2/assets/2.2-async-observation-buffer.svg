<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img">
<title>Optional async processing buffers four observations in Redis; acknowledgement can precede the batch write.</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs>
<rect width="1400" height="1000" fill="#F9FAFC"/>
<text x="48" y="80" text-anchor="start" font-family="Inter" font-size="40" font-weight="500" fill="#515774">Host observation writes</text>
<text x="48" y="136" text-anchor="start" font-family="Inter" font-size="28" font-weight="500" fill="#515774">Four observations: last-seen · label membership · policy membership</text>
<text x="48" y="180" text-anchor="start" font-family="Inter" font-size="28" font-weight="500" fill="#515774">Scheduled query statistics</text>
<rect x="48" y="388" width="260" height="136" rx="12" fill="#192147" stroke="#192147" stroke-width="2.5"/>
<text x="178.0" y="445.1" text-anchor="middle" font-family="Inter" font-size="36" font-weight="600" fill="#F9FAFC">Host</text>
