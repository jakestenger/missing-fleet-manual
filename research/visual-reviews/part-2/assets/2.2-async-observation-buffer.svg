<text x="460" y="502" text-anchor="start" font-family="Inter" font-size="30" font-weight="500" fill="#515774">Optional: asynchronous</text>
<text x="200" y="694" text-anchor="start" font-family="Inter" font-size="28" font-weight="500" fill="#515774">Redis memory cost</text>
<text x="862" y="694" text-anchor="middle" font-family="Inter" font-size="28" font-weight="400" fill="#515774">Batch writes</text>
<path d="M570 640 L570 780 L178 780 L178 524" fill="none" stroke="#8B8FA2" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 7" marker-end="url(#arrow)"/>
