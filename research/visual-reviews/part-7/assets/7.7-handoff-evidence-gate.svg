<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1328" viewBox="0 0 1400 1328" role="img">
<title>An organization reviews restore, upgrade and ownership evidence with named owners and results before accepting ongoing handoff responsibility.</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs>
<rect width="1400" height="1328" fill="#F9FAFC"/>
<text x="48" y="80" text-anchor="start" font-family="Inter" font-size="40" font-weight="500" fill="#515774">Make handoff acceptance depend on recorded evidence</text>
<text x="48" y="150" text-anchor="start" font-family="Inter" font-size="30" font-weight="500" fill="#515774">Your organization’s review process</text>
<rect x="48" y="216" width="392" height="264" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="244" y="278" text-anchor="middle" font-family="Inter" font-size="32" font-weight="500" fill="#192147">Restore rehearsal</text>
<rect x="72" y="332" width="344" height="56" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="244.0" y="369.8" text-anchor="middle" font-family="Inter" font-size="28" font-weight="500" fill="#192147">Owner</text>
<rect x="72" y="398" width="344" height="56" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="244.0" y="435.8" text-anchor="middle" font-family="Inter" font-size="28" font-weight="500" fill="#192147">Recorded result</text>
<path d="M244 480 L244 556" fill="none" stroke="#8B8FA2" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="504" y="216" width="392" height="264" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="700" y="278" text-anchor="middle" font-family="Inter" font-size="32" font-weight="500" fill="#192147">Upgrade rehearsal</text>
<rect x="528" y="332" width="344" height="56" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="700.0" y="369.8" text-anchor="middle" font-family="Inter" font-size="28" font-weight="500" fill="#192147">Owner</text>
<rect x="528" y="398" width="344" height="56" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="700.0" y="435.8" text-anchor="middle" font-family="Inter" font-size="28" font-weight="500" fill="#192147">Recorded result</text>
<path d="M700 480 L700 556" fill="none" stroke="#8B8FA2" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="960" y="216" width="392" height="264" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="1156" y="278" text-anchor="middle" font-family="Inter" font-size="32" font-weight="500" fill="#192147">Dependency / credential</text>
<text x="1156" y="320" text-anchor="middle" font-family="Inter" font-size="32" font-weight="500" fill="#192147">ownership record</text>
<rect x="984" y="332" width="344" height="56" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="1156.0" y="369.8" text-anchor="middle" font-family="Inter" font-size="28" font-weight="500" fill="#192147">Owner</text>
<rect x="984" y="398" width="344" height="56" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="1156.0" y="435.8" text-anchor="middle" font-family="Inter" font-size="28" font-weight="500" fill="#192147">Recorded result</text>
<path d="M1156 480 L1156 556" fill="none" stroke="#8B8FA2" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M244 556 L1156 556" fill="none" stroke="#8B8FA2" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M700 556 L700 644" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="456" y="644" width="488" height="128" rx="12" fill="#192147" stroke="#192147" stroke-width="2.5"/>
<text x="700.0" y="697.1" text-anchor="middle" font-family="Inter" font-size="36" font-weight="600" fill="#F9FAFC">Handoff review</text>
<text x="700.0" y="744.1" text-anchor="middle" font-family="Inter" font-size="36" font-weight="600" fill="#F9FAFC">Evidence complete?</text>
<path d="M456 708 L260 708 L260 888" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="340" y="674" text-anchor="middle" font-family="Inter" font-size="30" font-weight="400" fill="#515774">No</text>
<rect x="48" y="888" width="424" height="112" rx="12" fill="#FBEBDC" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="260.0" y="956.6" text-anchor="middle" font-family="Inter" font-size="36" font-weight="500" fill="#192147">Resolve the gap</text>
<path d="M260 1000 L260 1040 L568 1040 L568 772" fill="none" stroke="#8B8FA2" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 7" marker-end="url(#arrow)"/>
<text x="600" y="1016" text-anchor="start" font-family="Inter" font-size="30" font-weight="500" fill="#515774">Re-review</text>
<path d="M944 708 L1156 708 L1156 888" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="1040" y="674" text-anchor="middle" font-family="Inter" font-size="30" font-weight="400" fill="#515774">Yes</text>
<rect x="960" y="888" width="392" height="112" rx="12" fill="#D8FBEF" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="1156.0" y="956.6" text-anchor="middle" font-family="Inter" font-size="36" font-weight="500" fill="#192147">Accept handoff</text>
<path d="M1156 1000 L1156 1104 L700 1104 L700 1152" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="376" y="1152" width="648" height="112" rx="12" fill="#D3E8F3" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="700.0" y="1197.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="500" fill="#192147">Named primary + backup</text>
<text x="700.0" y="1241.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="500" fill="#192147">Continuing responsibility</text>
</svg>
