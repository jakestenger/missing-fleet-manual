<text x="244.0" y="1530.0" text-anchor="middle" font-family="Inter" font-size="30" font-weight="500" fill="#192147">replica unavailable</text>
<rect x="504" y="1436" width="392" height="128" rx="12" fill="#F6E4E8" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="700.0" y="1491.0" text-anchor="middle" font-family="Inter" font-size="30" font-weight="500" fill="#192147">Health check fails</text>
<text x="700.0" y="1530.0" text-anchor="middle" font-family="Inter" font-size="30" font-weight="500" fill="#192147">on every instance</text>
<rect x="960" y="1436" width="392" height="128" rx="12" fill="#F6E4E8" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="1156.0" y="1491.0" text-anchor="middle" font-family="Inter" font-size="30" font-weight="500" fill="#192147">Load balancer removes</text>
<text x="1156.0" y="1530.0" text-anchor="middle" font-family="Inter" font-size="30" font-weight="500" fill="#192147">every instance</text>
<path d="M440 1500 L504 1500" fill="none" stroke="#D66C7B" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M896 1500 L960 1500" fill="none" stroke="#D66C7B" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="700" y="1620" text-anchor="middle" font-family="Inter" font-size="30" font-weight="400" fill="#515774">Health-check-based removal · no fallback to the writer</text>
