<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1664" viewBox="0 0 1400 1664" role="img">
<title>Each Fleet instance has independent writer and replica connection ceilings; configured replica loss can remove every instance from a health-check-based load balancer.</title>
