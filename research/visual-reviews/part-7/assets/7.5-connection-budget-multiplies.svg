<text x="968" y="1196" text-anchor="start" font-family="Inter" font-size="28" font-weight="500" fill="#515774">Replica’s own</text>
<text x="968" y="1232" text-anchor="start" font-family="Inter" font-size="28" font-weight="500" fill="#515774">connection limit</text>
<text x="700" y="1320" text-anchor="middle" font-family="Inter" font-size="30" font-weight="400" fill="#515774">Ceilings on concurrent connections; not connections held at rest</text>
