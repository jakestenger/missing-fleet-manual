<text x="48" y="1184" text-anchor="start" font-family="Inter" font-size="30" font-weight="500" fill="#515774">At replica: N × R maximum concurrent connections</text>
<path d="M48 1212 L920 1212" fill="none" stroke="#5CABDF" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
