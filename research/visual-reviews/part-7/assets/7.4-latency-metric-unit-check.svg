<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1016" viewBox="0 0 1400 1016" role="img">
<title>The service latency family is named for microseconds but emits seconds in Fleet 4.90.0; thresholds need explicit unit checking.</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs>
<rect width="1400" height="1016" fill="#F9FAFC"/>
<text x="48" y="80" text-anchor="start" font-family="Inter" font-size="40" font-weight="500" fill="#515774">Check the latency metric’s emitted unit</text>
<rect x="48" y="168" width="1304" height="168" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="700" y="232" text-anchor="middle" font-family="Roboto Mono" font-size="31" font-weight="500" fill="#192147">api_service_request_latency_microseconds</text>
<text x="700" y="298" text-anchor="middle" font-family="Inter" font-size="34" font-weight="400" fill="#515774">Emitted in seconds at this release</text>
<rect x="48" y="456" width="312" height="144" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="204.0" y="539.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="500" fill="#192147">Raw seconds</text>
<rect x="480" y="456" width="456" height="144" rx="12" fill="#192147" stroke="#192147" stroke-width="2.5"/>
<text x="708.0" y="517.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="600" fill="#F9FAFC">Unit conversion /</text>
<text x="708.0" y="561.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="600" fill="#F9FAFC">threshold check</text>
<rect x="1056" y="456" width="296" height="144" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="1204.0" y="517.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="500" fill="#192147">Alert</text>
<text x="1204.0" y="561.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="500" fill="#192147">comparison</text>
<path d="M360 528 L480 528" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M936 528 L1056 528" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="700" y="700" text-anchor="middle" font-family="Inter" font-size="32" font-weight="400" fill="#515774">Illustrative value: 0.25 s = 250 ms = 250,000 microseconds</text>
<path d="M204 600 L204 864 L400 864" fill="none" stroke="#8B8FA2" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 7" marker-end="url(#arrow)"/>
<path d="M303 851 L329 877" fill="none" stroke="#D66C7B" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M303 877 L329 851" fill="none" stroke="#D66C7B" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="400" y="800" width="488" height="128" rx="12" fill="#F6E4E8" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="644.0" y="874.5" text-anchor="middle" font-family="Inter" font-size="30" font-weight="500" fill="#192147">Treat raw as microseconds</text>
<path d="M888 864 L1016 864" fill="none" stroke="#D66C7B" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="1016" y="800" width="336" height="128" rx="12" fill="#F6E4E8" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="1184.0" y="853.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="500" fill="#192147">Threshold</text>
<text x="1184.0" y="897.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="500" fill="#192147">mismatch</text>
</svg>
