<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1592" viewBox="0 0 1400 1592" role="img">
<title>Release devices and external dependencies, revoke credentials and preserve a final keyed backup before shutting down; deletion follows retention policy.</title>
