<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1168" viewBox="0 0 1400 1168" role="img">
<title>Linux and macOS escrow depend on the Fleet server private key; Windows escrow requires separately preserved Windows enrollment certificate and key.</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs>
<rect width="1400" height="1168" fill="#F9FAFC"/>
<text x="48" y="80" text-anchor="start" font-family="Inter" font-size="40" font-weight="500" fill="#515774">Preserve each escrow chain’s recovery material</text>
<text x="244" y="176" text-anchor="middle" font-family="Inter" font-size="34" font-weight="600" fill="#192147">Linux LUKS</text>
<text x="700" y="176" text-anchor="middle" font-family="Inter" font-size="34" font-weight="600" fill="#192147">macOS FileVault</text>
<text x="1156" y="176" text-anchor="middle" font-family="Inter" font-size="34" font-weight="600" fill="#192147">Windows BitLocker</text>
<text x="48" y="250" text-anchor="start" font-family="Inter" font-size="30" font-weight="500" fill="#515774">Configuration material · outside the database</text>
<rect x="48" y="292" width="848" height="128" rx="12" fill="#192147" stroke="#192147" stroke-width="2.5"/>
<text x="472.0" y="368.6" text-anchor="middle" font-family="Inter" font-size="36" font-weight="600" fill="#F9FAFC">Fleet server private key</text>
<rect x="960" y="292" width="392" height="128" rx="12" fill="#FBEBDC" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="1156.0" y="346.2" text-anchor="middle" font-family="Inter" font-size="32" font-weight="500" fill="#192147">Windows enrolment</text>
<text x="1156.0" y="388.2" text-anchor="middle" font-family="Inter" font-size="32" font-weight="500" fill="#192147">certificate + key</text>
<rect x="48" y="520" width="1304" height="496" rx="12" fill="#E8F1F6" stroke="#192147" stroke-width="2.5"/>
<text x="80" y="580" text-anchor="start" font-family="Inter" font-size="32" font-weight="500" fill="#515774">MySQL</text>
<text x="80" y="622" text-anchor="start" font-family="Inter" font-size="32" font-weight="500" fill="#515774">backup</text>
<path d="M472 632 L472 984" fill="none" stroke="#C5C7D1" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M928 632 L928 984" fill="none" stroke="#C5C7D1" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="528" y="656" width="368" height="144" rx="12" fill="#D3E8F3" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="712.0" y="718.2" text-anchor="middle" font-family="Inter" font-size="32" font-weight="500" fill="#192147">Apple CA material</text>
<text x="712.0" y="760.2" text-anchor="middle" font-family="Inter" font-size="32" font-weight="500" fill="#192147">Encrypted</text>
<rect x="80" y="872" width="368" height="112" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="264.0" y="939.2" text-anchor="middle" font-family="Inter" font-size="32" font-weight="500" fill="#192147">Linux escrow</text>
<rect x="528" y="872" width="368" height="112" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="712.0" y="939.2" text-anchor="middle" font-family="Inter" font-size="32" font-weight="500" fill="#192147">FileVault escrow</text>
<rect x="976" y="872" width="344" height="112" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="1148.0" y="939.2" text-anchor="middle" font-family="Inter" font-size="32" font-weight="500" fill="#192147">BitLocker escrow</text>
<path d="M264 872 L264 420" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M712 872 L712 800" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M712 656 L712 420" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M1148 872 L1148 420" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="700" y="1088" text-anchor="middle" font-family="Inter" font-size="30" font-weight="400" fill="#515774">Database backup + Fleet server private key: Linux and macOS</text>
<text x="700" y="1127" text-anchor="middle" font-family="Inter" font-size="30" font-weight="400" fill="#515774">Windows also needs its enrolment certificate and key</text>
</svg>
