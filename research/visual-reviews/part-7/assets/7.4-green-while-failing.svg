<text x="700" y="1640" text-anchor="middle" font-family="Inter" font-size="28" font-weight="400" fill="#515774">Pool statistics, errors</text>
<text x="700" y="1684" text-anchor="middle" font-family="Inter" font-size="28" font-weight="400" fill="#515774">and cache counters</text>
<text x="700" y="1728" text-anchor="middle" font-family="Inter" font-size="28" font-weight="400" fill="#515774">Export pipeline only</text>
<rect x="960" y="1460" width="392" height="328" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
