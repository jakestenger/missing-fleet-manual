<text x="1156" y="1596" text-anchor="middle" font-family="Inter" font-size="28" font-weight="400" fill="#515774">Check-in freshness</text>
<text x="1156" y="1640" text-anchor="middle" font-family="Inter" font-size="28" font-weight="400" fill="#515774">Per-host queue age</text>
<text x="1156" y="1684" text-anchor="middle" font-family="Inter" font-size="28" font-weight="400" fill="#515774">Per-host update times</text>
