<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="2000" viewBox="0 0 1400 2000" role="img">
<title>A database and Redis check can stay green while five service outcomes fail; the metrics endpoint, export pipeline and operational reads provide distinct evidence.</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs>
<rect width="1400" height="2000" fill="#F9FAFC"/>
<text x="48" y="80" text-anchor="start" font-family="Inter" font-size="40" font-weight="500" fill="#515774">Observe each service outcome independently</text>
<rect x="48" y="152" width="424" height="136" rx="12" fill="#D8FBEF" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="260.0" y="209.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="500" fill="#192147">Fleet health check</text>
<text x="260.0" y="253.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="500" fill="#192147">Database + Redis</text>
<text x="256" y="356" text-anchor="middle" font-family="Inter" font-size="28" font-weight="400" fill="#515774">Green can persist</text>
<text x="256" y="392" text-anchor="middle" font-family="Inter" font-size="28" font-weight="400" fill="#515774">through every failure below</text>
<text x="568" y="216" text-anchor="start" font-family="Inter" font-size="30" font-weight="500" fill="#515774">A failed health response does not</text>
<text x="568" y="255" text-anchor="start" font-family="Inter" font-size="30" font-weight="500" fill="#515774">identify which check failed.</text>
<text x="48" y="444" text-anchor="start" font-family="Inter" font-size="30" font-weight="500" fill="#515774">Independent failure lanes · illustrative, not a timing chart</text>
<text x="48" y="530" text-anchor="start" font-family="Inter" font-size="32" font-weight="500" fill="#192147">Administrative access</text>
