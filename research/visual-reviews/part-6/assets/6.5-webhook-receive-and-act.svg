<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1352" viewBox="0 0 1400 1352" role="img">
<title>Receiver-owned durable intake is separate from worker reconciliation and bounded, repeatable effects; event identity is modeled by the receiver.</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs>
<rect width="1400" height="1352" fill="#F9FAFC"/>
<text x="48" y="80" text-anchor="start" font-family="Inter" font-size="40" font-weight="500" fill="#515774">Receiver design: record receipt, then perform the work</text>
<rect x="392" y="164" width="960" height="1080" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="424" y="228" text-anchor="start" font-family="Inter" font-size="34" font-weight="500" fill="#515774">Logic and storage you implement</text>
<rect x="48" y="316" width="256" height="144" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="176.0" y="377.1" text-anchor="middle" font-family="Inter" font-size="36" font-weight="500" fill="#192147">Webhook</text>
<text x="176.0" y="424.1" text-anchor="middle" font-family="Inter" font-size="36" font-weight="500" fill="#192147">receipt</text>
<path d="M304 388 L440 388" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="440" y="316" width="472" height="144" rx="12" fill="#192147" stroke="#192147" stroke-width="2.5"/>
<text x="676.0" y="377.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="600" fill="#F9FAFC">Validate and durably</text>
<text x="676.0" y="421.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="600" fill="#F9FAFC">record event</text>
<path d="M676 460 L676 568" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="440" y="568" width="472" height="112" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="676.0" y="635.2" text-anchor="middle" font-family="Inter" font-size="32" font-weight="500" fill="#192147">Acknowledge promptly</text>
<text x="176" y="566" text-anchor="middle" font-family="Inter" font-size="28" font-weight="400" fill="#515774">Repeated /</text>
<text x="176" y="602" text-anchor="middle" font-family="Inter" font-size="28" font-weight="400" fill="#515774">unordered delivery</text>
<path d="M176 632 L176 664 L344 664 L344 424 L440 424" fill="none" stroke="#8B8FA2" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 7" marker-end="url(#arrow)"/>
<path d="M912 388 L1040 388 L1040 756 L944 756" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="1140" y="544" text-anchor="middle" font-family="Inter" font-size="30" font-weight="400" fill="#515774">Independent</text>
<text x="1140" y="583" text-anchor="middle" font-family="Inter" font-size="30" font-weight="400" fill="#515774">worker path</text>
<rect x="440" y="700" width="504" height="176" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="692.0" y="757.2" text-anchor="middle" font-family="Inter" font-size="32" font-weight="500" fill="#192147">Reconcile current state</text>
<text x="692.0" y="799.2" text-anchor="middle" font-family="Inter" font-size="32" font-weight="500" fill="#192147">Use event / entity model</text>
<text x="692.0" y="841.2" text-anchor="middle" font-family="Inter" font-size="32" font-weight="500" fill="#192147">Side effect needed?</text>
<path d="M692 876 L692 952" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="736" y="920" text-anchor="start" font-family="Inter" font-size="28" font-weight="500" fill="#515774">Yes</text>
<path d="M944 820 L1168 820 L1168 952" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="1024" y="862" text-anchor="start" font-family="Inter" font-size="28" font-weight="500" fill="#515774">No</text>
<rect x="440" y="952" width="504" height="128" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="692.0" y="1005.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="500" fill="#192147">Apply bounded,</text>
<text x="692.0" y="1049.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="500" fill="#192147">repeatable side effect</text>
<path d="M944 1016 L1032 1016" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="1032" y="952" width="272" height="128" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="1168.0" y="1005.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="500" fill="#192147">Record</text>
<text x="1168.0" y="1049.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="500" fill="#192147">outcome</text>
<text x="700" y="1308" text-anchor="middle" font-family="Inter" font-size="30" font-weight="400" fill="#515774">No universal delivery ID or timestamp-only deduplication key</text>
</svg>
