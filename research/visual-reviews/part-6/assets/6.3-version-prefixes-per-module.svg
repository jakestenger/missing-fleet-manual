<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1224" viewBox="0 0 1400 1224" role="img">
<title>Module and route availability determine usable version prefixes; latest is a registered path, not a redirect or frozen schema.</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs>
<rect width="1400" height="1224" fill="#F9FAFC"/>
<text x="48" y="80" text-anchor="start" font-family="Inter" font-size="40" font-weight="500" fill="#515774">Version prefixes are registered per module</text>
<rect x="48" y="324" width="320" height="176" rx="12" fill="#192147" stroke="#192147" stroke-width="2.5"/>
<text x="208.0" y="425.3" text-anchor="middle" font-family="Inter" font-size="38" font-weight="600" fill="#F9FAFC">One API client</text>
<rect x="616" y="172" width="736" height="252" rx="12" fill="#D3E8F3" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="648" y="232" text-anchor="start" font-family="Inter" font-size="36" font-weight="500" fill="#515774">Core module</text>
<rect x="648" y="264" width="176" height="76" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="736.0" y="314" text-anchor="middle" font-family="Roboto Mono" font-size="30" font-weight="500" fill="#192147">v1</text>
<rect x="856" y="264" width="208" height="76" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="960.0" y="314" text-anchor="middle" font-family="Roboto Mono" font-size="30" font-weight="500" fill="#192147">2022-04</text>
<rect x="1112" y="264" width="176" height="76" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="1200.0" y="314" text-anchor="middle" font-family="Roboto Mono" font-size="30" font-weight="500" fill="#192147">latest</text>
<text x="648" y="388" text-anchor="start" font-family="Inter" font-size="30" font-weight="500" fill="#515774">Example route: 2022-04 or latest</text>
<rect x="616" y="500" width="736" height="252" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="648" y="560" text-anchor="start" font-family="Inter" font-size="36" font-weight="500" fill="#515774">Activities module</text>
<rect x="648" y="592" width="176" height="76" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="736.0" y="642" text-anchor="middle" font-family="Roboto Mono" font-size="30" font-weight="500" fill="#192147">v1</text>
<rect x="1112" y="592" width="176" height="76" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="1200.0" y="642" text-anchor="middle" font-family="Roboto Mono" font-size="30" font-weight="500" fill="#192147">latest</text>
<text x="648" y="716" text-anchor="start" font-family="Inter" font-size="30" font-weight="500" fill="#515774">Example route: v1 or latest</text>
<path d="M368 380 L480 380 L480 388 L616 388" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="384" y="278" text-anchor="start" font-family="Inter" font-size="28" font-weight="500" fill="#515774">Needs the</text>
<text x="384" y="314" text-anchor="start" font-family="Inter" font-size="28" font-weight="500" fill="#515774">core route</text>
<path d="M368 444 L480 444 L480 716 L616 716" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="240" y="584" text-anchor="start" font-family="Inter" font-size="28" font-weight="500" fill="#515774">Needs the</text>
<text x="240" y="620" text-anchor="start" font-family="Inter" font-size="28" font-weight="500" fill="#515774">activities route</text>
<path d="M960 424 L960 500" fill="none" stroke="#FAA669" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 7"/>
<text x="960" y="818" text-anchor="middle" font-family="Inter" font-size="28" font-weight="400" fill="#515774">No single dated prefix serves both example routes</text>
<text x="700" y="888" text-anchor="middle" font-family="Inter" font-size="30" font-weight="400" fill="#515774">Prefixes select route availability, not response schema</text>
<rect x="48" y="1024" width="392" height="144" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="244.0" y="1087.0" text-anchor="middle" font-family="Inter" font-size="30" font-weight="500" fill="#192147">Use each route’s</text>
<text x="244.0" y="1126.0" text-anchor="middle" font-family="Inter" font-size="30" font-weight="500" fill="#192147">documented prefix</text>
<rect x="504" y="1024" width="392" height="144" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="700.0" y="1087.0" text-anchor="middle" font-family="Inter" font-size="30" font-weight="500" fill="#192147">Use mixed prefixes</text>
<text x="700.0" y="1126.0" text-anchor="middle" font-family="Inter" font-size="30" font-weight="500" fill="#192147">in one client</text>
<rect x="960" y="1024" width="392" height="144" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="1156.0" y="1087.0" text-anchor="middle" font-family="Inter" font-size="30" font-weight="500" fill="#192147">Use latest everywhere</text>
<text x="1156.0" y="1126.0" text-anchor="middle" font-family="Inter" font-size="30" font-weight="500" fill="#192147">with release-pinned tests</text>
<path d="M208 500 L208 956 L1156 956" fill="none" stroke="#8B8FA2" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M244 956 L244 1024" fill="none" stroke="#8B8FA2" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M700 956 L700 1024" fill="none" stroke="#8B8FA2" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M1156 956 L1156 1024" fill="none" stroke="#8B8FA2" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
</svg>
