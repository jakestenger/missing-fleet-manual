<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1392" viewBox="0 0 1400 1392" role="img">
<title>An ambiguous write is reconciled against current state before bounded retry or escalation; acceptance and device outcome are separate.</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs>
<rect width="1400" height="1392" fill="#F9FAFC"/>
<text x="48" y="80" text-anchor="start" font-family="Inter" font-size="40" font-weight="500" fill="#515774">Read current state after an ambiguous write</text>
<rect x="48" y="176" width="352" height="120" rx="12" fill="#192147" stroke="#192147" stroke-width="2.5"/>
<text x="224.0" y="249.3" text-anchor="middle" font-family="Inter" font-size="38" font-weight="600" fill="#F9FAFC">Request sent</text>
<path d="M400 236 L512 236" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="512" y="176" width="352" height="120" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="688.0" y="247.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="500" fill="#192147">Clear response</text>
<path d="M224 296 L224 392" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="48" y="392" width="352" height="144" rx="12" fill="#FBEBDC" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="224.0" y="453.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="500" fill="#192147">Timeout /</text>
<text x="224.0" y="497.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="500" fill="#192147">unknown outcome</text>
<path d="M400 464 L512 464" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="512" y="376" width="840" height="176" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="932.0" y="454.2" text-anchor="middle" font-family="Inter" font-size="32" font-weight="500" fill="#192147">Read current state</text>
<text x="932.0" y="496.2" text-anchor="middle" font-family="Inter" font-size="32" font-weight="500" fill="#192147">Retained identifier or documented scoped key</text>
<text x="932" y="614" text-anchor="middle" font-family="Inter" font-size="30" font-weight="400" fill="#515774">Already pending: evidence to inspect</text>
<rect x="416" y="708" width="512" height="120" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="672.0" y="779.2" text-anchor="middle" font-family="Inter" font-size="32" font-weight="500" fill="#192147">Intended result observed</text>
<rect x="1040" y="708" width="312" height="120" rx="12" fill="#D8FBEF" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="1196.0" y="778.5" text-anchor="middle" font-family="Inter" font-size="30" font-weight="500" fill="#192147">Verify convergence</text>
<path d="M928 768 L1040 768" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="416" y="916" width="512" height="120" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="672.0" y="966.2" text-anchor="middle" font-family="Inter" font-size="32" font-weight="500" fill="#192147">Definitely absent AND</text>
<text x="672.0" y="1008.2" text-anchor="middle" font-family="Inter" font-size="32" font-weight="500" fill="#192147">endpoint safe to repeat</text>
<rect x="1040" y="916" width="312" height="120" rx="12" fill="#FBEBDC" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="1196.0" y="986.5" text-anchor="middle" font-family="Inter" font-size="30" font-weight="500" fill="#192147">Bounded retry policy</text>
<path d="M928 976 L1040 976" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="416" y="1124" width="512" height="120" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="672.0" y="1195.2" text-anchor="middle" font-family="Inter" font-size="32" font-weight="500" fill="#192147">Still ambiguous</text>
<rect x="1040" y="1124" width="312" height="120" rx="12" fill="#F6E4E8" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="1196.0" y="1194.5" text-anchor="middle" font-family="Inter" font-size="30" font-weight="500" fill="#192147">Stop / escalate</text>
<path d="M928 1184 L1040 1184" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M672 552 L672 660 L360 660 L360 1184" fill="none" stroke="#8B8FA2" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M360 768 L416 768" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M360 976 L416 976" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M360 1184 L416 1184" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="700" y="1336" text-anchor="middle" font-family="Inter" font-size="30" font-weight="400" fill="#515774">Verify request acceptance and device outcome separately</text>
</svg>
