<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1696" viewBox="0 0 1400 1696" role="img">
<title>fleetctl maps the returned client-action error to zero or one; script outcome, ignored local work and queued work need different evidence.</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs>
<rect width="1400" height="1696" fill="#F9FAFC"/>
<text x="48" y="80" text-anchor="start" font-family="Inter" font-size="40" font-weight="500" fill="#515774">fleetctl exit status follows the client action</text>
<text x="48" y="148" text-anchor="start" font-family="Inter" font-size="32" font-weight="500" fill="#515774">Illustrative server-backed command path</text>
<rect x="48" y="192" width="352" height="112" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="224.0" y="258.5" text-anchor="middle" font-family="Inter" font-size="30" font-weight="500" fill="#192147">1  fleetctl invocation</text>
<rect x="48" y="376" width="352" height="112" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="224.0" y="442.5" text-anchor="middle" font-family="Inter" font-size="30" font-weight="500" fill="#192147">2  Request sent</text>
<rect x="48" y="560" width="352" height="112" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="224.0" y="626.5" text-anchor="middle" font-family="Inter" font-size="30" font-weight="500" fill="#192147">3  Fleet accepts it</text>
<rect x="48" y="744" width="352" height="144" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="224.0" y="807.0" text-anchor="middle" font-family="Inter" font-size="30" font-weight="500" fill="#192147">4  Work runs</text>
<text x="224.0" y="846.0" text-anchor="middle" font-family="Inter" font-size="30" font-weight="500" fill="#192147">or is queued</text>
<rect x="512" y="744" width="352" height="144" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="688.0" y="807.0" text-anchor="middle" font-family="Inter" font-size="30" font-weight="500" fill="#192147">5  Result or accepted</text>
<text x="688.0" y="846.0" text-anchor="middle" font-family="Inter" font-size="30" font-weight="500" fill="#192147">response returns</text>
<rect x="512" y="560" width="352" height="112" rx="12" fill="#192147" stroke="#192147" stroke-width="2.5"/>
<text x="688.0" y="607.0" text-anchor="middle" font-family="Inter" font-size="30" font-weight="600" fill="#F9FAFC">6  Client renders</text>
<text x="688.0" y="646.0" text-anchor="middle" font-family="Inter" font-size="30" font-weight="600" fill="#F9FAFC">the result</text>
<rect x="512" y="296" width="352" height="176" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="688.0" y="375.0" text-anchor="middle" font-family="Inter" font-size="30" font-weight="500" fill="#192147">7  Did client action</text>
<text x="688.0" y="414.0" text-anchor="middle" font-family="Inter" font-size="30" font-weight="500" fill="#192147">return an error?</text>
<path d="M224 304 L224 376" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M224 488 L224 560" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M224 672 L224 744" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M400 816 L512 816" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M688 744 L688 672" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M688 560 L688 472" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M864 344 L1016 344" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="940" y="310" text-anchor="middle" font-family="Inter" font-size="28" font-weight="400" fill="#515774">No</text>
<rect x="1016" y="288" width="336" height="112" rx="12" fill="#D8FBEF" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="1184.0" y="356.6" text-anchor="middle" font-family="Inter" font-size="36" font-weight="500" fill="#192147">Exit 0</text>
<path d="M864 428 L940 428 L940 508 L1016 508" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="884" y="478" text-anchor="start" font-family="Inter" font-size="28" font-weight="500" fill="#515774">Yes</text>
<rect x="1016" y="452" width="336" height="112" rx="12" fill="#F6E4E8" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="1184.0" y="520.6" text-anchor="middle" font-family="Inter" font-size="36" font-weight="500" fill="#192147">Exit 1</text>
<text x="1184" y="632" text-anchor="middle" font-family="Inter" font-size="28" font-weight="400" fill="#515774">Most exit 0 results</text>
<text x="1184" y="668" text-anchor="middle" font-family="Inter" font-size="28" font-weight="400" fill="#515774">are ordinary success</text>
<text x="1128" y="764" text-anchor="middle" font-family="Inter" font-size="28" font-weight="400" fill="#515774">Wrapper timeout, signal,</text>
<text x="1128" y="800" text-anchor="middle" font-family="Inter" font-size="28" font-weight="400" fill="#515774">or failure to start may</text>
<text x="1128" y="836" text-anchor="middle" font-family="Inter" font-size="28" font-weight="400" fill="#515774">produce another status</text>
<text x="48" y="988" text-anchor="start" font-family="Inter" font-size="36" font-weight="500" fill="#515774">Where the operational outcome appears</text>
<rect x="48" y="1040" width="392" height="424" rx="12" fill="#D3E8F3" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="244" y="1104" text-anchor="middle" font-family="Inter" font-size="36" font-weight="600" fill="#192147">Printed output</text>
<text x="244" y="1170" text-anchor="middle" font-family="Inter" font-size="28" font-weight="400" fill="#515774">Script ran; script exit</text>
<text x="244" y="1216" text-anchor="middle" font-family="Inter" font-size="28" font-weight="400" fill="#515774">code is non-zero</text>
<text x="244" y="1262" text-anchor="middle" font-family="Inter" font-size="28" font-weight="400" fill="#515774">fleetctl exits 0: client</text>
<text x="244" y="1308" text-anchor="middle" font-family="Inter" font-size="28" font-weight="400" fill="#515774">action completed</text>
<rect x="504" y="1040" width="392" height="424" rx="12" fill="#FBEBDC" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="700" y="1104" text-anchor="middle" font-family="Inter" font-size="36" font-weight="600" fill="#192147">Nowhere</text>
<text x="700" y="1170" text-anchor="middle" font-family="Inter" font-size="28" font-weight="400" fill="#515774">Client-only exception:</text>
<text x="700" y="1216" text-anchor="middle" font-family="Inter" font-size="28" font-weight="400" fill="#515774">accepted delete kind</text>
<text x="700" y="1262" text-anchor="middle" font-family="Inter" font-size="28" font-weight="400" fill="#515774">is parsed and ignored</text>
<text x="700" y="1308" text-anchor="middle" font-family="Inter" font-size="28" font-weight="400" fill="#515774">No message · No error</text>
<text x="700" y="1354" text-anchor="middle" font-family="Inter" font-size="28" font-weight="400" fill="#515774">No effect · Exit 0</text>
<rect x="960" y="1040" width="392" height="424" rx="12" fill="#FBEBDC" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="1156" y="1104" text-anchor="middle" font-family="Inter" font-size="36" font-weight="600" fill="#192147">Fleet later</text>
<text x="1156" y="1170" text-anchor="middle" font-family="Inter" font-size="28" font-weight="400" fill="#515774">Asynchronous work queued</text>
<text x="1156" y="1216" text-anchor="middle" font-family="Inter" font-size="28" font-weight="400" fill="#515774">Final outcome is</text>
<text x="1156" y="1262" text-anchor="middle" font-family="Inter" font-size="28" font-weight="400" fill="#515774">not yet knowable</text>
<text x="244" y="1388" text-anchor="middle" font-family="Inter" font-size="28" font-weight="400" fill="#515774">--quiet removes the</text>
<text x="244" y="1424" text-anchor="middle" font-family="Inter" font-size="28" font-weight="400" fill="#515774">script exit-code line</text>
<path d="M1156 1292 L1156 1332" fill="none" stroke="#8B8FA2" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="984" y="1332" width="344" height="100" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="1156.0" y="1373.8" text-anchor="middle" font-family="Inter" font-size="28" font-weight="500" fill="#192147">Read Fleet state</text>
<text x="1156.0" y="1409.8" text-anchor="middle" font-family="Inter" font-size="28" font-weight="500" fill="#192147">afterwards</text>
<text x="48" y="1536" text-anchor="start" font-family="Inter" font-size="30" font-weight="500" fill="#515774">Standard error</text>
<path d="M416 1524 L1352 1524" fill="none" stroke="#8B8FA2" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="48" y="1620" text-anchor="start" font-family="Inter" font-size="30" font-weight="500" fill="#515774">Standard output</text>
<path d="M416 1608 L1352 1608" fill="none" stroke="#8B8FA2" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
</svg>
