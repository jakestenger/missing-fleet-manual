<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1240" viewBox="0 0 1400 1240" role="img">
<title>A Premium multi-file apply may clear token assignments before fleet creation, leaving them cleared after an intervening failure.</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs>
<rect width="1400" height="1240" fill="#F9FAFC"/>
<text x="48" y="80" text-anchor="start" font-family="Inter" font-size="40" font-weight="500" fill="#515774">The GitOps assignment-loss window</text>
<text x="48" y="148" text-anchor="start" font-family="Inter" font-size="30" font-weight="500" fill="#515774">Premium multi-file run references a fleet that does not yet exist</text>
<rect x="48" y="224" width="568" height="144" rx="12" fill="#192147" stroke="#192147" stroke-width="2.5"/>
<text x="332.0" y="308.6" text-anchor="middle" font-family="Inter" font-size="36" font-weight="600" fill="#F9FAFC">Existing assignments</text>
<rect x="48" y="428" width="568" height="144" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="332.0" y="489.1" text-anchor="middle" font-family="Inter" font-size="36" font-weight="500" fill="#192147">Temporarily clear</text>
<text x="332.0" y="536.1" text-anchor="middle" font-family="Inter" font-size="36" font-weight="500" fill="#192147">assignment lists</text>
<rect x="48" y="684" width="568" height="144" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="332.0" y="768.6" text-anchor="middle" font-family="Inter" font-size="36" font-weight="500" fill="#192147">Create / configure fleets</text>
<rect x="48" y="940" width="568" height="144" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="332.0" y="1024.6" text-anchor="middle" font-family="Inter" font-size="36" font-weight="500" fill="#192147">Restore assignments</text>
<path d="M332 368 L332 428" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M332 572 L332 684" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M332 828 L332 940" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="664" y="428" width="688" height="456" rx="12" fill="#FBEBDC" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="696" y="490" text-anchor="start" font-family="Inter" font-size="36" font-weight="500" fill="#515774">Assignment-loss window</text>
<path d="M616 756 L760 756" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="1032" y="624" text-anchor="middle" font-family="Inter" font-size="30" font-weight="400" fill="#515774">Failure</text>
<rect x="760" y="660" width="544" height="176" rx="12" fill="#F6E4E8" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="1032.0" y="737.1" text-anchor="middle" font-family="Inter" font-size="36" font-weight="500" fill="#192147">Live assignments</text>
<text x="1032.0" y="784.1" text-anchor="middle" font-family="Inter" font-size="36" font-weight="500" fill="#192147">remain cleared</text>
<rect x="760" y="940" width="544" height="244" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="1032.0" y="999.8" text-anchor="middle" font-family="Inter" font-size="28" font-weight="500" fill="#192147">Inspect live state</text>
<text x="1032.0" y="1035.8" text-anchor="middle" font-family="Inter" font-size="28" font-weight="500" fill="#192147">Fix first failure</text>
<text x="1032.0" y="1071.8" text-anchor="middle" font-family="Inter" font-size="28" font-weight="500" fill="#192147">Rerun same complete commit</text>
<text x="1032.0" y="1107.8" text-anchor="middle" font-family="Inter" font-size="28" font-weight="500" fill="#192147">and full file set</text>
<text x="1032.0" y="1143.8" text-anchor="middle" font-family="Inter" font-size="28" font-weight="500" fill="#192147">Verify routing and associations</text>
<path d="M1032 836 L1032 940" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M648 428 L648 940" fill="none" stroke="#8B8FA2" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
</svg>
