<text x="918.0" y="257.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="500" fill="#192147">Enrollment</text>
<text x="918.0" y="301.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="500" fill="#192147">identity</text>
<rect x="1092" y="164" width="260" height="208" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="1222" y="210" text-anchor="middle" font-family="Inter" font-size="30" font-weight="600" fill="#192147">Custom input</text>
