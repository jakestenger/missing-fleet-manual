<text x="234.0" y="258.2" text-anchor="middle" font-family="Inter" font-size="32" font-weight="500" fill="#192147">Collected and filtered</text>
<text x="234.0" y="300.2" text-anchor="middle" font-family="Inter" font-size="32" font-weight="500" fill="#192147">from the device</text>
