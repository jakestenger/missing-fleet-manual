<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="992" viewBox="0 0 1400 992" role="img">
<title>The in-scope compliance population includes passing, failing and no-answer hosts; out-of-scope hosts are outside that denominator.</title>
