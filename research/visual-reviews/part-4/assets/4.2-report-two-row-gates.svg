<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1072" viewBox="0 0 1400 1072" role="img">
<title>A fixed per-host threshold rejects oversized result sets before storage; report_cap later trims estate-wide rows by insertion recency.</title>
