<text x="496" y="423" text-anchor="start" font-family="Inter" font-size="30" font-weight="500" fill="#515774">Entire host result rejected</text>
<text x="48" y="522" text-anchor="start" font-family="Inter" font-size="32" font-weight="500" fill="#515774">Path B · report_cap = 500</text>
