<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="944" viewBox="0 0 1400 944" role="img">
<title>Revoking an enroll secret leaves existing node-key authentication intact but blocks later enrollment using the revoked secret.</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs>
<rect width="1400" height="944" fill="#F9FAFC"/>
<text x="48" y="80" text-anchor="start" font-family="Inter" font-size="40" font-weight="500" fill="#515774">An enroll secret and a node key have different lifetimes</text>
<path d="M788 150 L788 682" fill="none" stroke="#8B8FA2" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 8"/>
<text x="788" y="128" text-anchor="middle" font-family="Inter" font-size="30" font-weight="600" fill="#192147">Secret revoked</text>
<text x="48" y="216" text-anchor="start" font-family="Inter" font-size="34" font-weight="500" fill="#515774">Existing host</text>
<rect x="48" y="254" width="348" height="128" rx="12" fill="#192147" stroke="#192147" stroke-width="2.5"/>
<text x="222.0" y="332.0" text-anchor="middle" font-family="Inter" font-size="40" font-weight="600" fill="#F9FAFC">Node key</text>
<path d="M396 318 L1012 318" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="1012" y="254" width="340" height="128" rx="12" fill="#D8FBEF" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="1182.0" y="307.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="500" fill="#192147">Ordinary check-ins</text>
<text x="1182.0" y="351.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="500" fill="#192147">continue</text>
<text x="48" y="492" text-anchor="start" font-family="Inter" font-size="34" font-weight="500" fill="#515774">Installer / rebuild path</text>
<rect x="48" y="530" width="348" height="128" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="222.0" y="606.6" text-anchor="middle" font-family="Inter" font-size="36" font-weight="500" fill="#192147">Old enroll secret</text>
<path d="M396 594 L844 594" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M864 580 L892 608" fill="none" stroke="#D66C7B" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M864 608 L892 580" fill="none" stroke="#D66C7B" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="924" y="530" width="428" height="128" rx="12" fill="#F6E4E8" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="1138.0" y="583.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="500" fill="#192147">Later enrollment</text>
<text x="1138.0" y="627.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="500" fill="#192147">blocked: revoked</text>
<text x="450" y="550" text-anchor="start" font-family="Inter" font-size="28" font-weight="500" fill="#515774">Enrollment attempt</text>
<text x="48" y="748" text-anchor="start" font-family="Inter" font-size="34" font-weight="500" fill="#515774">Safe rotation order</text>
<rect x="48" y="790" width="384" height="106" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="240.0" y="833.2" text-anchor="middle" font-family="Inter" font-size="32" font-weight="500" fill="#192147">Replace distributed</text>
<text x="240.0" y="875.2" text-anchor="middle" font-family="Inter" font-size="32" font-weight="500" fill="#192147">secret</text>
<rect x="508" y="790" width="384" height="106" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="700.0" y="833.2" text-anchor="middle" font-family="Inter" font-size="32" font-weight="500" fill="#192147">Test fresh</text>
<text x="700.0" y="875.2" text-anchor="middle" font-family="Inter" font-size="32" font-weight="500" fill="#192147">enrollment</text>
<rect x="968" y="790" width="384" height="106" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="1160.0" y="833.2" text-anchor="middle" font-family="Inter" font-size="32" font-weight="500" fill="#192147">Revoke old</text>
<text x="1160.0" y="875.2" text-anchor="middle" font-family="Inter" font-size="32" font-weight="500" fill="#192147">secret</text>
<path d="M432 843 L508 843" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M892 843 L968 843" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
</svg>
