<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1104" viewBox="0 0 1400 1104" role="img">
<title>Google Admin deploys the Fleet ChromeOS extension and managed settings; enrollment returns a node key used for reporting without changing placement.</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs>
<rect width="1400" height="1104" fill="#F9FAFC"/>
<rect x="396" y="48" width="608" height="108" rx="12" fill="#192147" stroke="#192147" stroke-width="2.5"/>
<text x="700.0" y="116.0" text-anchor="middle" font-family="Inter" font-size="40" font-weight="600" fill="#F9FAFC">Google Admin console</text>
<rect x="48" y="390" width="808" height="610" rx="12" fill="#F9FAFC" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="300" y="450" text-anchor="start" font-family="Inter" font-size="38" font-weight="500" fill="#515774">ChromeOS device</text>
<rect x="48" y="224" width="384" height="112" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="240.0" y="269.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="500" fill="#192147">Force-installed</text>
<text x="240.0" y="313.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="500" fill="#192147">Fleet extension</text>
<rect x="508" y="224" width="500" height="136" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="758" y="273" text-anchor="middle" font-family="Inter" font-size="36" font-weight="500" fill="#192147">Managed policy</text>
<text x="758" y="328" text-anchor="middle" font-family="Roboto Mono" font-size="28" font-weight="500" fill="#192147">fleet_url + enroll_secret</text>
<path d="M548 156 L548 190 L240 190 L240 224" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M852 156 L852 190 L758 190 L758 224" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M240 336 L240 534" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M758 360 L758 494 L432 494 L432 534" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="80" y="534" width="624" height="128" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="392.0" y="612.0" text-anchor="middle" font-family="Inter" font-size="40" font-weight="500" fill="#192147">Fleet extension</text>
<rect x="1068" y="534" width="284" height="128" rx="12" fill="#192147" stroke="#192147" stroke-width="2.5"/>
<text x="1210.0" y="613.4" text-anchor="middle" font-family="Inter" font-size="44" font-weight="600" fill="#F9FAFC">Fleet</text>
<path d="M704 582 L1068 582" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="886" y="558" text-anchor="middle" font-family="Inter" font-size="28" font-weight="400" fill="#515774">Initial enrollment</text>
<path d="M1160 662 L1160 750 L704 750" fill="none" stroke="#515774" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="1000" y="718" text-anchor="middle" font-family="Inter" font-size="28" font-weight="400" fill="#515774">Node key issued</text>
<rect x="80" y="722" width="624" height="104" rx="12" fill="#D3E8F3" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="392.0" y="786.6" text-anchor="middle" font-family="Inter" font-size="36" font-weight="500" fill="#192147">Stored node key</text>
<path d="M704 806 L1280 806 L1280 662" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="1012" y="880" text-anchor="middle" font-family="Inter" font-size="30" font-weight="400" fill="#515774">Ordinary reporting</text>
<path d="M264 826 L264 890 L520 890 L520 826" fill="none" stroke="#8B8FA2" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 7" marker-end="url(#arrow)"/>
<text x="434" y="944" text-anchor="middle" font-family="Inter" font-size="30" font-weight="400" fill="#515774">Existing host keeps placement</text>
<text x="700" y="1028" text-anchor="middle" font-family="Inter" font-size="30" font-weight="400" fill="#515774">Changing the policy secret does not transfer an existing host</text>
</svg>
