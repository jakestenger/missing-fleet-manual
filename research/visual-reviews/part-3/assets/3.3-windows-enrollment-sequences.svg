<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1320" viewBox="0 0 1400 1320" role="img">
<title>Agent-first Windows enrollment and Entra MDM-first enrollment require independent confirmation of both agent and MDM state.</title>
