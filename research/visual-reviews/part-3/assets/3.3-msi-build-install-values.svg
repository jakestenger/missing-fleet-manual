<text x="80" y="110" text-anchor="start" font-family="Inter" font-size="38" font-weight="500" fill="#515774">Build</text>
<text x="92" y="174" text-anchor="start" font-family="Roboto Mono" font-size="30" font-weight="500" fill="#192147">--fleet-url=dummy</text>
<text x="92" y="222" text-anchor="start" font-family="Roboto Mono" font-size="30" font-weight="500" fill="#192147">--enroll-secret=dummy</text>
<path d="M530 214 L704 214" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
