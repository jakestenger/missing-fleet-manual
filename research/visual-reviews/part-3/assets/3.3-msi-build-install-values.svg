<text x="80" y="599" text-anchor="start" font-family="Roboto Mono" font-size="28" font-weight="500" fill="#192147">FLEET_URL</text>
<text x="80" y="641" text-anchor="start" font-family="Roboto Mono" font-size="28" font-weight="500" fill="#192147">FLEET_SECRET = &lt;secret A&gt;</text>
