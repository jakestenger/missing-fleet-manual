<text x="80" y="330" text-anchor="start" font-family="Inter" font-size="30" font-weight="500" fill="#515774">One reusable artifact</text>
<text x="48" y="446" text-anchor="start" font-family="Inter" font-size="38" font-weight="500" fill="#515774">Install</text>
