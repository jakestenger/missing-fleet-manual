<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="912" viewBox="0 0 1400 912" role="img">
<title>Installation traverses variants by date added; uninstall chooses the first active package, even when the host received another.</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs>
<rect width="1400" height="912" fill="#F9FAFC"/>
<text x="48" y="80" text-anchor="start" font-family="Inter" font-size="40" font-weight="500" fill="#515774">Install and uninstall choose packages differently</text>
<text x="48" y="152" text-anchor="start" font-family="Inter" font-size="30" font-weight="500" fill="#515774">Same active packages, ordered by date added: P1 → P2 → P3</text>
<text x="48" y="242" text-anchor="start" font-family="Inter" font-size="36" font-weight="500" fill="#515774">Install selection</text>
<rect x="48" y="288" width="392" height="176" rx="12" fill="#F6E4E8" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="244.0" y="345.2" text-anchor="middle" font-family="Inter" font-size="32" font-weight="500" fill="#192147">P1</text>
<text x="244.0" y="387.2" text-anchor="middle" font-family="Inter" font-size="32" font-weight="500" fill="#192147">Scope / platform</text>
<text x="244.0" y="429.2" text-anchor="middle" font-family="Inter" font-size="32" font-weight="500" fill="#192147">test fails</text>
<rect x="504" y="288" width="392" height="176" rx="12" fill="#D8FBEF" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="700.0" y="345.2" text-anchor="middle" font-family="Inter" font-size="32" font-weight="500" fill="#192147">P2</text>
<text x="700.0" y="387.2" text-anchor="middle" font-family="Inter" font-size="32" font-weight="500" fill="#192147">Tests pass</text>
<text x="700.0" y="429.2" text-anchor="middle" font-family="Inter" font-size="32" font-weight="500" fill="#192147">Selected</text>
<rect x="960" y="288" width="392" height="176" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="1156.0" y="366.2" text-anchor="middle" font-family="Inter" font-size="32" font-weight="500" fill="#192147">P3</text>
<text x="1156.0" y="408.2" text-anchor="middle" font-family="Inter" font-size="32" font-weight="500" fill="#192147">Not reached</text>
<path d="M440 376 L504 376" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M896 376 L944 376" fill="none" stroke="#8B8FA2" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 7"/>
<path d="M917 365 L939 387" fill="none" stroke="#D66C7B" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M917 387 L939 365" fill="none" stroke="#D66C7B" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
<text x="48" y="576" text-anchor="start" font-family="Inter" font-size="36" font-weight="500" fill="#515774">Uninstall selection</text>
<rect x="48" y="620" width="392" height="176" rx="12" fill="#FBEBDC" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="244.0" y="677.2" text-anchor="middle" font-family="Inter" font-size="32" font-weight="500" fill="#192147">P1</text>
<text x="244.0" y="719.2" text-anchor="middle" font-family="Inter" font-size="32" font-weight="500" fill="#192147">First active package</text>
<text x="244.0" y="761.2" text-anchor="middle" font-family="Inter" font-size="32" font-weight="500" fill="#192147">No variant resolution</text>
<rect x="504" y="620" width="392" height="176" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="700.0" y="697.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="500" fill="#192147">P2</text>
<text x="700.0" y="741.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="500" fill="#192147">Not examined</text>
<rect x="960" y="620" width="392" height="176" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="1156.0" y="697.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="500" fill="#192147">P3</text>
<text x="1156.0" y="741.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="500" fill="#192147">Not examined</text>
<path d="M700 464 L700 544 L984 544" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="984" y="500" width="344" height="88" rx="12" fill="#192147" stroke="#192147" stroke-width="2.5"/>
<text x="1156.0" y="554.5" text-anchor="middle" font-family="Inter" font-size="30" font-weight="600" fill="#F9FAFC">Host received P2</text>
<text x="700" y="866" text-anchor="middle" font-family="Inter" font-size="30" font-weight="400" fill="#515774">Uninstall selection does not resolve the variant installed on this host</text>
</svg>
