<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1232" viewBox="0 0 1400 1232" role="img">
<title>An author-written script checks desired state before changing it, verifies the result and reports meaningful exit codes.</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs>
<rect width="1400" height="1232" fill="#F9FAFC"/>
<text x="48" y="80" text-anchor="start" font-family="Inter" font-size="40" font-weight="500" fill="#515774">Example authoring pattern: ensure a file exists</text>
<rect x="424" y="164" width="504" height="112" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="676.0" y="232.6" text-anchor="middle" font-family="Inter" font-size="36" font-weight="500" fill="#192147">Validate prerequisites</text>
<path d="M676 276 L676 356" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="712" y="326" text-anchor="start" font-family="Inter" font-size="30" font-weight="500" fill="#515774">Ready</text>
<rect x="424" y="356" width="504" height="144" rx="12" fill="#192147" stroke="#192147" stroke-width="2.5"/>
<text x="676.0" y="417.1" text-anchor="middle" font-family="Inter" font-size="36" font-weight="600" fill="#F9FAFC">Desired state</text>
<text x="676.0" y="464.1" text-anchor="middle" font-family="Inter" font-size="36" font-weight="600" fill="#F9FAFC">already present?</text>
<path d="M928 428 L1040 428" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="984" y="396" text-anchor="middle" font-family="Inter" font-size="30" font-weight="400" fill="#515774">Yes</text>
<rect x="1040" y="356" width="312" height="144" rx="12" fill="#D8FBEF" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="1196.0" y="418.2" text-anchor="middle" font-family="Inter" font-size="32" font-weight="500" fill="#192147">Report unchanged</text>
<text x="1196.0" y="460.2" text-anchor="middle" font-family="Inter" font-size="32" font-weight="500" fill="#192147">Exit 0</text>
<path d="M676 500 L676 572" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="712" y="550" text-anchor="start" font-family="Inter" font-size="30" font-weight="500" fill="#515774">No</text>
<rect x="424" y="572" width="504" height="112" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="676.0" y="640.6" text-anchor="middle" font-family="Inter" font-size="36" font-weight="500" fill="#192147">Apply required change</text>
<path d="M676 684 L676 764" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="424" y="764" width="504" height="112" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="676.0" y="832.6" text-anchor="middle" font-family="Inter" font-size="36" font-weight="500" fill="#192147">Verify desired state</text>
<path d="M928 820 L1040 820" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="984" y="788" text-anchor="middle" font-family="Inter" font-size="28" font-weight="400" fill="#515774">Verified</text>
<rect x="1040" y="748" width="312" height="144" rx="12" fill="#D8FBEF" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="1196.0" y="810.2" text-anchor="middle" font-family="Inter" font-size="32" font-weight="500" fill="#192147">Report changed</text>
<text x="1196.0" y="852.2" text-anchor="middle" font-family="Inter" font-size="32" font-weight="500" fill="#192147">Exit 0</text>
<rect x="48" y="996" width="360" height="144" rx="12" fill="#F6E4E8" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="228.0" y="1057.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="500" fill="#192147">Report reason</text>
<text x="228.0" y="1101.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="500" fill="#192147">Exit nonzero</text>
<path d="M424 220 L228 220 L228 996" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="64" y="328" text-anchor="start" font-family="Inter" font-size="30" font-weight="500" fill="#515774">Not ready</text>
<path d="M424 820 L316 820 L316 996" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="336" y="920" text-anchor="start" font-family="Inter" font-size="30" font-weight="500" fill="#515774">Failed</text>
<path d="M1196 500 L1196 604 L1376 604 L1376 120 L676 120 L676 164" fill="none" stroke="#8B8FA2" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 7" marker-end="url(#arrow)"/>
<text x="1048" y="672" text-anchor="start" font-family="Inter" font-size="28" font-weight="500" fill="#515774">Repeat invocation</text>
<text x="820" y="1078" text-anchor="middle" font-family="Inter" font-size="30" font-weight="400" fill="#515774">Author implements these checks;</text>
<text x="820" y="1117" text-anchor="middle" font-family="Inter" font-size="30" font-weight="400" fill="#515774">Fleet does not verify the desired state automatically</text>
</svg>
