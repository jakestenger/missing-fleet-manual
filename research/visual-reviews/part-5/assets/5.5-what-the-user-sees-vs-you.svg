<text x="216.0" y="1186.0" text-anchor="middle" font-family="Inter" font-size="30" font-weight="500" fill="#192147">Profile state</text>
<rect x="472" y="1160" width="416" height="120" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
