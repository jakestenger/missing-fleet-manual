<rect x="968" y="1088" width="384" height="104" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="1160.0" y="1150.5" text-anchor="middle" font-family="Inter" font-size="30" font-weight="500" fill="#192147">Upcoming activities</text>
<rect x="968" y="1252" width="384" height="104" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="1160.0" y="1314.5" text-anchor="middle" font-family="Inter" font-size="30" font-weight="500" fill="#192147">Past activities</text>
