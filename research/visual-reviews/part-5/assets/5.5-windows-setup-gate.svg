<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1360" viewBox="0 0 1400 1360" role="img">
<title>Only automatic Windows enrollment while in OOBE blocks setup; failure outcomes depend on stop-on-failure.</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs>
<rect width="1400" height="1360" fill="#F9FAFC"/>
<text x="48" y="80" text-anchor="start" font-family="Inter" font-size="40" font-weight="500" fill="#515774">When Windows setup blocks first use</text>
<rect x="48" y="168" width="536" height="176" rx="12" fill="#192147" stroke="#192147" stroke-width="2.5"/>
<text x="316.0" y="245.1" text-anchor="middle" font-family="Inter" font-size="36" font-weight="600" fill="#F9FAFC">Automatic enrollment</text>
<text x="316.0" y="292.1" text-anchor="middle" font-family="Inter" font-size="36" font-weight="600" fill="#F9FAFC">AND currently in OOBE?</text>
<path d="M584 256 L856 256" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="720" y="220" text-anchor="middle" font-family="Inter" font-size="32" font-weight="400" fill="#515774">No</text>
<rect x="856" y="168" width="496" height="176" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="1104.0" y="245.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="500" fill="#192147">Non-blocking browser setup</text>
<text x="1104.0" y="289.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="500" fill="#192147">No ESP hold</text>
<path d="M316 344 L316 456" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="346" y="404" text-anchor="middle" font-family="Inter" font-size="32" font-weight="400" fill="#515774">Yes</text>
<rect x="48" y="456" width="536" height="144" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="316.0" y="517.1" text-anchor="middle" font-family="Inter" font-size="36" font-weight="500" fill="#192147">ESP waits for</text>
<text x="316.0" y="564.1" text-anchor="middle" font-family="Inter" font-size="36" font-weight="500" fill="#192147">unfinished work</text>
<text x="948" y="650" text-anchor="middle" font-family="Inter" font-size="30" font-weight="400" fill="#515774">Profile failure is release-ready</text>
<path d="M584 528 L856 528" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="720" y="490" text-anchor="middle" font-family="Inter" font-size="28" font-weight="400" fill="#515774">Normal completion</text>
<rect x="856" y="476" width="496" height="104" rx="12" fill="#D8FBEF" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="1104.0" y="540.6" text-anchor="middle" font-family="Inter" font-size="36" font-weight="500" fill="#192147">Release</text>
<path d="M316 600 L316 748 L688 748 L688 856" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="432" y="728" text-anchor="start" font-family="Inter" font-size="30" font-weight="500" fill="#515774">Software failure / approx. 3-hour timeout</text>
<rect x="432" y="856" width="512" height="112" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="688.0" y="925.3" text-anchor="middle" font-family="Inter" font-size="38" font-weight="500" fill="#192147">Stop-on-failure?</text>
<path d="M556 968 L556 1028 L300 1028 L300 1096" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="380" y="1000" text-anchor="middle" font-family="Inter" font-size="30" font-weight="400" fill="#515774">Enabled</text>
<path d="M820 968 L820 1028 L1100 1028 L1100 1096" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="1010" y="1000" text-anchor="middle" font-family="Inter" font-size="30" font-weight="400" fill="#515774">Disabled</text>
<rect x="48" y="1096" width="504" height="176" rx="12" fill="#FBEBDC" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="300.0" y="1173.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="500" fill="#192147">Cancel remaining work</text>
<text x="300.0" y="1217.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="500" fill="#192147">Reset only</text>
<rect x="848" y="1096" width="504" height="176" rx="12" fill="#FBEBDC" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="1100.0" y="1174.2" text-anchor="middle" font-family="Inter" font-size="32" font-weight="500" fill="#192147">Other work finishes</text>
<text x="1100.0" y="1216.2" text-anchor="middle" font-family="Inter" font-size="32" font-weight="500" fill="#192147">Reset or Continue anyway</text>
</svg>
