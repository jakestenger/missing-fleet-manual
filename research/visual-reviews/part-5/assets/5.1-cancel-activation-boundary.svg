<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="768" viewBox="0 0 1400 768" role="img">
<title>Queued cancellation removes a request; activation is distinct from delivery and lock/wipe cannot be cancelled after activation.</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs>
<rect width="1400" height="768" fill="#F9FAFC"/>
<text x="48" y="80" text-anchor="start" font-family="Inter" font-size="40" font-weight="500" fill="#515774">Cancellation depends on the work’s lifecycle</text>
<rect x="48" y="244" width="272" height="140" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="184.0" y="326.6" text-anchor="middle" font-family="Inter" font-size="36" font-weight="500" fill="#192147">Queued</text>
<rect x="392" y="244" width="272" height="140" rx="12" fill="#192147" stroke="#192147" stroke-width="2.5"/>
<text x="528.0" y="326.6" text-anchor="middle" font-family="Inter" font-size="36" font-weight="600" fill="#F9FAFC">Activated</text>
<rect x="736" y="244" width="272" height="140" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="872.0" y="303.1" text-anchor="middle" font-family="Inter" font-size="36" font-weight="500" fill="#192147">Handed to</text>
<text x="872.0" y="350.1" text-anchor="middle" font-family="Inter" font-size="36" font-weight="500" fill="#192147">channel</text>
<rect x="1080" y="244" width="272" height="140" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="1216.0" y="303.1" text-anchor="middle" font-family="Inter" font-size="36" font-weight="500" fill="#192147">Device</text>
<text x="1216.0" y="350.1" text-anchor="middle" font-family="Inter" font-size="36" font-weight="500" fill="#192147">execution</text>
<path d="M320 314 L392 314" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M664 314 L736 314" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M1008 314 L1080 314" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M356 160 L356 448" fill="none" stroke="#8B8FA2" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 7"/>
<text x="392" y="184" text-anchor="start" font-family="Inter" font-size="30" font-weight="500" fill="#515774">Activation boundary</text>
<path d="M184 384 L184 536" fill="none" stroke="#192147" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="232" y="476" text-anchor="middle" font-family="Inter" font-size="30" font-weight="400" fill="#515774">Cancel</text>
<rect x="48" y="536" width="272" height="112" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="184.0" y="581.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="500" fill="#192147">Removed</text>
<text x="184.0" y="625.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="500" fill="#192147">request</text>
<rect x="392" y="536" width="272" height="150" rx="12" fill="#FBEBDC" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="528.0" y="582.5" text-anchor="middle" font-family="Inter" font-size="30" font-weight="500" fill="#192147">Lock / wipe:</text>
<text x="528.0" y="621.5" text-anchor="middle" font-family="Inter" font-size="30" font-weight="500" fill="#192147">cancellation</text>
<text x="528.0" y="660.5" text-anchor="middle" font-family="Inter" font-size="30" font-weight="500" fill="#192147">refused</text>
<path d="M528 384 L528 536" fill="none" stroke="#8B8FA2" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="856" y="566" width="320" height="108" rx="12" fill="#E8F1F6" stroke="#C5C7D1" stroke-width="2.5"/>
<text x="1016.0" y="631.9" text-anchor="middle" font-family="Inter" font-size="34" font-weight="500" fill="#192147">Fleet tracking</text>
<path d="M872 384 L872 464 L888 464 L888 566" fill="none" stroke="#8B8FA2" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 7"/>
<text x="1060" y="508" text-anchor="middle" font-family="Inter" font-size="28" font-weight="400" fill="#515774">Tracking may end;</text>
<text x="1060" y="544" text-anchor="middle" font-family="Inter" font-size="28" font-weight="400" fill="#515774">work can still execute</text>
<text x="700" y="734" text-anchor="middle" font-family="Inter" font-size="30" font-weight="400" fill="#515774">Offline status does not establish cancellability</text>
</svg>
