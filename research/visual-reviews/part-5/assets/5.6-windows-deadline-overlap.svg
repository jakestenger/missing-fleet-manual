<text x="160" y="802" text-anchor="middle" font-family="Inter" font-size="28" font-weight="400" fill="#515774">Discovered</text>
<text x="964" y="902" text-anchor="middle" font-family="Inter" font-size="28" font-weight="400" fill="#515774">Restart pending</text>
<text x="1050" y="584" text-anchor="middle" font-family="Inter" font-size="30" font-weight="400" fill="#515774">Restart boundary: day 8</text>
<text x="700" y="1030" text-anchor="middle" font-family="Inter" font-size="32" font-weight="400" fill="#515774">Later of discovery + deadline and restart-pending + grace</text>
<text x="700" y="1080" text-anchor="middle" font-family="Inter" font-size="28" font-weight="400" fill="#515774">Active hours do not extend the effective boundary</text>
