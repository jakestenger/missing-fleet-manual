name: Build check

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install
        working-directory: website
        run: npm ci

      - name: Build
        working-directory: website
        run: npm run build

      # A missing image is a hard webpack failure, and a renamed heading silently
      # breaks every anchor pointing into it. Both have bitten this repo.
      - name: Check links, anchors and images
        run: python3 build/check-links.py

      # check-links.py proves a target exists. It cannot tell whether "as 2.9 notes, X"
      # is true of 2.9. One such claim shipped and was caught by review, not tooling.
      # Advisory: this always exits 0 and prints for a human to judge.
      - name: Check cross-reference attributions
        run: python3 build/check-crossrefs.py

      # A gate, not advice. status: verified now means a source check AND an
      # independent review pass. Twelve chapters once carried the stamp on the
      # first alone and an external review found a defect in every one.
      - name: Check verified stamps are backed by evidence
        run: python3 build/check-verified.py

      # Three invented activity names shipped in reference tables, where a reader
      # would reasonably build monitoring on them. Skips silently without a local
      # Fleet checkout, so it is advisory here and authoritative locally.
      - name: Check activity names exist in Fleet's source
        run: python3 build/check-activity-names.py

      # Two invented schedule names shipped in a list a reader would use with
      # fleetctl trigger. Same shape as the activity check.
      - name: Check schedule names exist in Fleet's source
        run: python3 build/check-schedule-names.py

      # Part VIII prints SQL a reader runs during an incident. A table that was
      # renamed or never existed sends them to an error at the worst moment.
      - name: Check queried tables exist in Fleet's schema
        run: python3 build/check-table-names.py

      # A column name is as easy to get wrong as a table name and fails the same
      # way: an error in the middle of an incident, from a query the manual
      # supplied.
      - name: Check queried columns exist in Fleet's schema
        run: python3 build/check-column-names.py

      # The manual states what one release does. A link to blob/main promises a
      # source and hands the reader a file that has since changed, which is
      # worse than no link: it looks like a citation and behaves like a guess.
      - name: Check repository links are pinned to the verified tag
        run: python3 build/check-pinned-links.py

      # A placeholder the shell reads as redirection. `--enroll-secret=<secret>`
      # inside a fence fails before Fleet is contacted, and it was in this
      # manual's primary macOS installation command.
      - name: Check fenced shell commands have no unquoted placeholders
        run: python3 build/check-shell-placeholders.py

      # STYLE forbids em-dashes. Eleven accumulated in one long session, which
      # is what a rule with no check behind it looks like.
      - name: Check for em-dashes
        run: python3 build/check-em-dashes.py
