name: Build check

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install
        working-directory: website
        run: npm ci

      - name: Build
        working-directory: website
        run: npm run build

      # A missing image is a hard webpack failure, and a renamed heading silently
      # breaks every anchor pointing into it. Both have bitten this repo.
      - name: Check links, anchors and images
        run: python3 build/check-links.py

      # check-links.py proves a target exists. It cannot tell whether "as 2.9 notes, X"
      # is true of 2.9. One such claim shipped and was caught by review, not tooling.
      # Advisory: this always exits 0 and prints for a human to judge.
      - name: Check cross-reference attributions
        run: python3 build/check-crossrefs.py

      # A gate, not advice. status: verified now means a source check AND an
      # independent review pass. Twelve chapters once carried the stamp on the
      # first alone and an external review found a defect in every one.
      - name: Check verified stamps are backed by evidence
        run: python3 build/check-verified.py

      # Three invented activity names shipped in reference tables, where a reader
      # would reasonably build monitoring on them. Skips silently without a local
      # Fleet checkout, so it is advisory here and authoritative locally.
      - name: Check activity names exist in Fleet's source
        run: python3 build/check-activity-names.py
