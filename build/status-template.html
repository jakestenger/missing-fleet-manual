<title>Missing Fleet Manual Build Status</title>
<style>
  :root {
    --ink:      #192147;
    --muted:    #515774;
    --faint:    #8B8FA2;
    --rule:     #C5C7D1;
    --band:     #E2E4EA;
    --ground:   #F9FAFC;
    --panel:    #FFFFFF;
    --tint:     #E8F1F6;
    --tint-2:   #D3E8F3;

    --s-outline:  #8B8FA2;
    --s-drafting: #2E86C6;
    --s-capped:   #C4732C;
    --s-clean:    #3F8F2E;
    --s-blocked:  #B14A5C;
    --s-verified: #009A7D;

    --shadow: 0 1px 2px rgba(25,33,71,.06), 0 8px 24px -16px rgba(25,33,71,.28);

    --serif: ui-serif, "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans:  ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    --mono:  ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink:    #E7ECF8;
      --muted:  #A7AFC8;
      --faint:  #7B84A0;
      --rule:   #333C60;
      --band:   #262E4C;
      --ground: #11172C;
      --panel:  #181F39;
      --tint:   #1D2645;
      --tint-2: #232D51;

      --s-outline:  #7B84A0;
      --s-drafting: #6DB6E8;
      --s-capped:   #E8A567;
      --s-clean:    #7FCB63;
      --s-blocked:  #E08296;
      --s-verified: #3FC9AB;

      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 28px -18px rgba(0,0,0,.8);
    }
  }
  :root[data-theme="dark"] {
    --ink:    #E7ECF8;
    --muted:  #A7AFC8;
    --faint:  #7B84A0;
    --rule:   #333C60;
    --band:   #262E4C;
    --ground: #11172C;
    --panel:  #181F39;
    --tint:   #1D2645;
    --tint-2: #232D51;

    --s-outline:  #7B84A0;
    --s-drafting: #6DB6E8;
    --s-capped:   #E8A567;
    --s-clean:    #7FCB63;
    --s-blocked:  #E08296;
    --s-verified: #3FC9AB;

    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 28px -18px rgba(0,0,0,.8);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 1080px;
    margin: 0 auto;
    padding: 44px 24px 88px;
    display: flex;
    flex-direction: column;
    gap: 40px;
  }

  /* ---- masthead ---- */
  .masthead { display: flex; flex-direction: column; gap: 14px; }
  .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .13em;
    text-transform: uppercase;
    color: var(--faint);
  }
  h1 {
    font-family: var(--serif);
    font-weight: 600;
    font-size: clamp(30px, 4.4vw, 44px);
    line-height: 1.1;
    letter-spacing: -.015em;
    margin: 0;
    text-wrap: balance;
  }
  .standfirst {
    margin: 0;
    max-width: 62ch;
    color: var(--muted);
    font-size: 16px;
  }

  /* ---- governing rules ---- */
  .rules { display: flex; flex-wrap: wrap; gap: 12px; }
  .rule-card {
    flex: 1 1 260px;
    background: var(--panel);
    border: 1px solid var(--rule);
    border-radius: 3px;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 5px;
    box-shadow: var(--shadow);
  }
  .rule-card .k {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--faint);
  }
  .rule-card .v { font-weight: 600; font-size: 15px; }
  .rule-card .n { color: var(--muted); font-size: 13.5px; }

  /* ---- summary ---- */
  .totals {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(132px, 1fr));
    gap: 1px;
    background: var(--rule);
    border: 1px solid var(--rule);
    border-radius: 3px;
    overflow: hidden;
  }
  .tot { background: var(--panel); padding: 15px 16px; display: flex; flex-direction: column; gap: 3px; }
  .tot .num {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    font-size: 26px;
    font-weight: 600;
    letter-spacing: -.02em;
  }
  .tot .lab {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--faint);
  }

  /* ---- part sections ---- */
  .part { display: flex; flex-direction: column; gap: 12px; }
  .part-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .part-num {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: .1em;
    color: var(--faint);
    padding-top: 2px;
  }
  .part-head h2 {
    font-family: var(--serif);
    font-weight: 600;
    font-size: 21px;
    letter-spacing: -.01em;
    margin: 0;
  }
  .part-meta {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .scroller { overflow-x: auto; border: 1px solid var(--rule); border-radius: 3px; background: var(--panel); }
  table { border-collapse: collapse; width: 100%; min-width: 660px; }
  th, td { text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--band); vertical-align: middle; }
  thead th {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--faint);
    font-weight: 500;
    background: var(--tint);
    border-bottom: 1px solid var(--rule);
    white-space: nowrap;
  }
  tbody tr:last-child td { border-bottom: 0; }
  td.sec {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    color: var(--muted);
    white-space: nowrap;
    width: 1%;
  }
  td.title { font-weight: 500; }
  td.num {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    text-align: right;
    white-space: nowrap;
    color: var(--muted);
  }

  /* status pill */
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .06em;
    text-transform: uppercase;
    white-space: nowrap;
    color: var(--sc, var(--muted));
  }
  .pill::before {
    content: "";
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--sc, var(--faint));
    flex: none;
  }
  .s-outline  { --sc: var(--s-outline); }
  .s-drafting { --sc: var(--s-drafting); }
  .s-capped   { --sc: var(--s-capped); }
  .s-clean    { --sc: var(--s-clean); }
  .s-blocked  { --sc: var(--s-blocked); }

  /* round meter: five cells because the cap is exactly five */
  .meter { display: inline-flex; gap: 3px; align-items: center; }
  .meter i {
    width: 9px; height: 14px;
    border-radius: 1px;
    background: var(--band);
    display: block;
  }
  .meter i.on { background: var(--mc, var(--s-drafting)); }
  .meter.full i.on { background: var(--s-capped); }
  .meter-none { color: var(--faint); font-family: var(--mono); font-size: 11.5px; }

  /* collapsed outline parts */
  .stub {
    border: 1px dashed var(--rule);
    border-radius: 3px;
    background: transparent;
    padding: 13px 16px;
    display: flex;
    gap: 14px;
    align-items: baseline;
    flex-wrap: wrap;
    color: var(--muted);
    font-size: 14px;
  }
  .stub strong { color: var(--ink); font-weight: 600; }
  .stub .list { font-size: 13.5px; color: var(--faint); }

  .note {
    font-size: 13.5px;
    color: var(--muted);
    max-width: 76ch;
    margin: 0;
  }
  .note code, td code {
    font-family: var(--mono);
    font-size: .92em;
    background: var(--tint);
    padding: 1px 5px;
    border-radius: 2px;
  }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 20px;
    padding-top: 4px;
    border-top: 1px solid var(--band);
    margin-top: 4px;
  }
  footer { color: var(--faint); font-size: 13px; border-top: 1px solid var(--band); padding-top: 18px; }
  footer p { margin: 0 0 6px; }
</style>
